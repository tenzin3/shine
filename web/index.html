/* Free matcher: the person's words (plus related words from Datamuse) are scored against
   hand-written keywords for each lesson and collection. */
const STOP=new Set(`about above after again against also always am an and any are as at be because been before being below between both but by can cant could did do does doing dont down during each even ever every feel feeling feels felt few for from further get gets getting got had has have having he her here hers him his how i im ive if in into is it its just keep keeps know like lot lots make me more most much my myself no nor not now of off on once only or other our out over own really same she should so some someone something such than that the their them then there these they thing things this those through to too under until up very was we were what when where which while who why will with would you your yours yourself one back always never still want wants need needs going all last month week year day since everything anything nothing very lately recently today`.split(/\s+/));
const stem=w=>{w=w.toLowerCase().replace(/[^a-z]/g,'');for(const x of['fulness','iness','ness','ments','ment','ings','ing','edly','ied','ies','ed','ful','ily','ly','es','s','y'])if(w.length-x.length>=4&&w.endsWith(x))return w.slice(0,-x.length);return w};
const sameStem=(a,b)=>a===b||(a.length>=5&&b.length>=5&&(a.startsWith(b)||b.startsWith(a)));
const PHRASES=[
 [/\b(passed away|lost (my|our|her|his|a|someone)|died|funeral|death of)\b/,'death grief'],
 [/\bmiss(ing)? (my|our|home|family|mom|mum|dad|parents)/,'homesick missing family'],
 [/\bcan'?t (focus|concentrate|sit still|stop thinking)/,'distracted restless'],
 [/\bnew to (meditat|buddh)|how (do i|to) (start|begin|meditate)/,'beginner']];
let VOCAB=null;
function vocab(){
  if(VOCAB)return VOCAB; VOCAB={};
  for(const t of TEXTS){
    const v=new Map(),info=(MATCH_DATA.lessons||{})[t.id]||{};
    const add=(text,w)=>{for(const word of String(text).toLowerCase().split(/[^a-z]+/)){if(word.length<3||STOP.has(word))continue;const k=stem(word);if((v.get(k)?.w||0)<w)v.set(k,{w,word})}};
    add(t.title+' '+(info.summary||''),1);
    add(((MATCH_DATA.collections||{})[t.playlist]||[]).join(' '),2);
    add((info.keywords||[]).join(' '),3);
    VOCAB[t.id]=v;
  }
  return VOCAB;
}
const dmCache=new Map();
function related(word){
  if(!dmCache.has(word))dmCache.set(word,(async()=>{
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5000);
    try{const r=await fetch('https://api.datamuse.com/words?ml='+encodeURIComponent(word)+'&max=20',{signal:ctl.signal});return r.ok?(await r.json()).map(x=>x.word):null}
    catch(e){return null}finally{clearTimeout(timer)}
  })());
  return dmCache.get(word);
}
async function localMatch(text){
  const low=text.toLowerCase().replace(/\ball the time\b/g,' ');
  const words=[...new Set(low.replace(/['’]/g,'').split(/[^a-z]+/).filter(w=>w.length>=3&&!STOP.has(w)))].slice(0,10);
  const terms=new Map();
  const put=(word,w,from)=>{if(word.length<3||STOP.has(word))return;const k=stem(word);const cur=terms.get(k);if(!cur||cur.w<w)terms.set(k,{w,from})};
  words.forEach(w=>put(w,1,w));
  for(const [re,extra] of PHRASES){const m=low.match(re);if(m)extra.split(' ').forEach(e=>put(e,1.5,m[0]))}
  const lists=await Promise.all(words.slice(0,8).map(related));
  lists.forEach((list,i)=>(list||[]).forEach((rw,rank)=>rw.toLowerCase().split(/[^a-z]+/).forEach(part=>put(part,0.4*(1-rank/25),words[i]))));
  const V=vocab(),ranked=[];
  for(const t of TEXTS){
    let score=0;const hits=new Set();
    for(const [k,term] of terms){let best=0;for(const [vk,vi] of V[t.id])if(vi.w>best&&sameStem(k,vk))best=vi.w;if(best){score+=term.w*best;hits.add(term.from)}}
    if(score>=1)ranked.push({t,score,hits:[...hits]});
  }
  ranked.sort((a,b)=>b.score-a.score);
  return {crisis:false,reflection:'',source:'datamuse',online:lists.some(l=>l!==null),
    picks:ranked.slice(0,3).map(r=>({id:r.t.id,why:((MATCH_DATA.lessons||{})[r.t.id]||{}).summary||'',hits:r.hits.slice(0,4)}))};
}

   `<div class="nav-links">`+items.map(s=>`<button class="nav-item" data-go="${s.id}" ${s.id===active?'aria-current="page"':""} style="--c1:${s.c[0]};--c2:${s.c[1]}"><span class="ring"><span><svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg></span></span>${esc(s.name)}</button>`).join("")+`</div>`+
   `<p class="legal">Texts from <a href="https://www.lotsawahouse.org" target="_blank" rel="noopener">Lotsawa House</a>, CC BY-NC 4.0. Shine is Buddhist practice and reflection, not medical advice.</p>`;
  document.querySelector(".nav-links").scrollLeft=scrollLeft;
}
const card=t=>`<button class="card" data-open="${t.id}"><div class="thumb">${pic(t,400)}<span class="dur"><svg viewBox="0 0 10 10"><path d="M1 0v10l9-5z"/></svg>${t.minutes} min</span></div><h3>${esc(t.title)}</h3><div class="sub">${esc(shelfOf(t.playlist).name)} · ${esc(t.author)}</div></button>`;
function today(){const pool=TEXTS.filter(t=>t.minutes<=6);return pool[Math.floor(Date.now()/864e5)%pool.length]}

function viewHome(){
  const t=today(), recent=store.get("shine-recent",[]).map(byId).filter(Boolean);
  let h=`<button class="banner" data-open="${t.id}"><span class="badge"><svg viewBox="0 0 24 24"><path d="M12 3c2.5 4 4 6 4 9a4 4 0 0 1-8 0c0-3 1.5-5 4-9z"/></svg></span><span><b>Today’s teaching:</b> ${esc(t.title)} by ${esc(t.author)} · ${t.minutes} min</span><span class="chev">›</span></button>`;
  h+=`<h1 class="coll">Tibetan wisdom for everyday life</h1><p class="intro">Short teachings from Tibetan Buddhist masters, gathered around the difficulties we all meet. Read them, or press play and listen.</p>`;
  h+=mindPanel();
  if(recent.length) h+=row("Continue","recent",recent);
  for(const s of SHELVES){const list=TEXTS.filter(x=>x.playlist===s.id); if(list.length) h+=row(s.name,s.id,list)}
  return h;
}
const row=(name,id,list)=>`<div class="row-head"><h2>${esc(name)}</h2>${id==="recent"?"":`<button data-go="${id}">See all ›</button>`}</div><div class="row">${list.map(card).join("")}</div>`;
function viewShelf(id){const s=shelfOf(id),list=TEXTS.filter(t=>t.playlist===id);return`<h1 class="coll">${esc(s.name)}</h1><p class="intro">${esc(s.line)}</p><div class="grid">${list.map(card).join("")}</div>`}
function viewSaved(){const list=store.get("shine-saved",[]).map(byId).filter(Boolean);return`<h1 class="coll">Saved</h1><p class="intro">Teachings you marked with the heart in the player.</p>`+(list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<p class="empty">Nothing saved yet. Open a teaching and tap the heart in the player bar.</p>`)}
function viewSearch(q){const ql=q.toLowerCase(),hits=TEXTS.filter(t=>(t.title+" "+t.author+" "+t.paras.join(" ")).toLowerCase().includes(ql));return`<h1 class="coll">Results for “${esc(q)}”</h1><p class="intro">${hits.length} teaching${hits.length===1?"":"s"}</p>`+(hits.length?`<div class="grid">${hits.map(card).join("")}</div>`:`<p class="empty">Try a feeling like “anger” or a master like “Patrul”.</p>`)}

/* "What's on your mind?" panel */
const EXAMPLES=["I can’t focus on my studies","I’m angry at someone close to me","I lost someone I love","I miss my family back home"];
const spark={text:'',status:'idle',result:null,error:''};
function crisisBox(){
  return `<div class="crisis" role="alert"><p><b>It sounds like you’re carrying something very heavy right now.</b> You don’t have to face it alone. Please reach out to someone today:</p>
  <ul><li>India: Tele-MANAS, call <a href="tel:14416">14416</a> (free, 24 hours)</li>
  <li>United States: call or text <a href="tel:988">988</a></li>
  <li>Elsewhere: find a helpline at <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a></li>
  <li>If you are in immediate danger, call your local emergency number (112 in India).</li></ul>
  <p>Talking with a trusted friend, family member or teacher can help too.</p></div>`;
}
function mindPanel(){
  const r=spark.result; let out='';
  if(spark.status==='loading') out=`<p class="mind-status" role="status">Finding teachings for you<span class="dots"></span></p>`;
  else if(spark.status==='error') out=`<p class="mind-status" role="alert">${esc(spark.error)}</p>`;
  else if(r&&r.crisis) out=crisisBox();
  else if(r){
    const picks=(r.picks||[]).map(p=>({t:byId(p.id),why:p.why,hits:p.hits})).filter(p=>p.t);
    out=(r.reflection?`<p class="reflect">${esc(r.reflection)}</p>`:'')+
      (picks.length?`<div class="picks">${picks.map(p=>`<div class="pick">${card(p.t)}${p.why?`<p class="why">${esc(p.why)}</p>`:''}${p.hits&&p.hits.length?`<p class="hits">Matched: ${p.hits.map(esc).join(', ')}</p>`:''}</div>`).join('')}</div>`
        :`<p class="mind-status">No close match this time. <button class="chip" data-go="beginners">Start here</button> is a good place to begin.</p>`);
  }
  const badge='Word matching · Datamuse';
  const note='Shine matches your words to its lessons using keywords and related words from <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener">Datamuse</a>, a free word-finding service. Only single words are looked up, and Shine doesn’t store what you write. Shine is Buddhist practice and reflection, not medical or mental-health care.';
  return `<section class="mind" aria-labelledby="mind-h"><div class="mind-head"><h2 id="mind-h">What’s on your mind?</h2><span class="spark-badge">${badge}</span></div>
  <form class="mind-form" id="mind-form"><textarea id="mind-text" maxlength="600" aria-labelledby="mind-h" placeholder="Write a few words, for example: I keep arguing with my brother and feel guilty afterwards.">${esc(spark.text)}</textarea>
  <div class="mind-actions">${EXAMPLES.map(x=>`<button type="button" class="chip" data-example="${esc(x)}">${esc(x)}</button>`).join('')}<button class="find" type="submit" ${spark.status==='loading'?'disabled':''}>Find teachings</button></div></form>
  <p class="mind-note">${note}</p>
  <div class="mind-out" aria-live="polite">${out}</div></section>`;
}
function rerenderMind(scroll){
  const old=document.querySelector('.mind'); if(!old) return;
  const tmp=document.createElement('div'); tmp.innerHTML=mindPanel(); old.replaceWith(tmp.firstElementChild);
  if(scroll) document.querySelector('.mind-out')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
async function findTeachings(text){
  spark.text=text=(text||'').trim();
  if(text.length<3){spark.status='error';spark.error='Write a few words about what’s on your mind.';return rerenderMind()}
  if(CRISIS_RE&&CRISIS_RE.test(text)){spark.result={crisis:true,picks:[]};spark.status='done';return rerenderMind(true)}
  spark.status='loading';spark.result=null;rerenderMind();
  try{spark.result=await localMatch(text);spark.status='done'}
  catch(e){spark.status='error';spark.error='Something went wrong while matching. Please try again.'}
  rerenderMind(true);
}
document.addEventListener('submit',e=>{if(e.target.id==='mind-form'){e.preventDefault();findTeachings(document.getElementById('mind-text').value)}});
document.addEventListener('input',e=>{if(e.target.id==='mind-text')spark.text=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='mind-text'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();findTeachings(e.target.value)}});

let current="home";
function go(id){
  current=id; const q=document.getElementById("q").value.trim();
  document.getElementById("view").innerHTML = q ? viewSearch(q) : id==="home"?viewHome(): id==="saved"?viewSaved(): viewShelf(id);
  rail(q?"":id); document.getElementById("content").scrollTop=0;
}

/* reader */
let openId=null;
function openReader(id,push=true){
  const t=byId(id); if(!t) return; openId=id; const s=shelfOf(t.playlist);
  document.getElementById("r-crumb").textContent=`${s.name} · ${t.minutes} min read`;
  document.getElementById("r-art").innerHTML=pic(t,500);
  document.getElementById("r-shelf").textContent=s.name;
  document.getElementById("r-title").textContent=t.title;
  document.getElementById("r-by").textContent=t.author;
  document.getElementById("r-text").innerHTML=t.paras.map((p,i)=>`<p data-i="${i}">${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
  document.getElementById("r-cite").innerHTML=`“${esc(t.title)}” by ${esc(t.author)}. ${esc(t.credit)} <a href="${t.url}" target="_blank" rel="noopener">Lotsawa House</a>, CC BY-NC 4.0.<br><span style="opacity:.7;font-size:.85rem">Version ${esc(t.version)} · retrieved ${esc(t.retrieved)} · ${t.id}</span>`;
  const more=TEXTS.filter(x=>x.playlist===t.playlist&&x.id!==t.id);
  document.getElementById("r-more").innerHTML=more.length?`<div class="row-head"><h2>More in ${esc(s.name)}</h2></div><div class="row">${more.map(card).join("")}</div>`:"";
  const r=document.getElementById("reader"); r.hidden=false; r.scrollTop=0;
  let rec=store.get("shine-recent",[]).filter(x=>x!==id); rec.unshift(id); store.set("shine-recent",rec.slice(0,8));
  if(player.id!==id) loadTrack(id);
  if(push&&location.hash!=="#"+id) location.hash=id;
}
function closeReader(){document.getElementById("reader").hidden=true; openId=null; if(SHELVES.some(s=>s.id===current)||current==="saved") history.replaceState(null,"","#"+current); else history.replaceState(null,"",location.pathname+location.search); go(current)}

/* Saved neural narration: one recording per lesson, with paragraph timestamps. */
const narration=new Audio();narration.preload='metadata';
const player={id:null,i:0,playing:false,buffering:false,token:0};
const fmt=s=>{const seconds=Math.max(0,Math.floor(Number(s)||0));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`};
function loadTrack(id){
  stop();const t=byId(id);player.id=id;player.i=0;
  const recording=AUDIO[id];
  document.getElementById('p-disc').innerHTML=pic(t,200);
  document.getElementById('p-title').textContent=t.title;
  document.getElementById('p-author').textContent=t.author;
  document.getElementById('p-narrator').textContent=recording?recording.narrator:'Recording unavailable';
  if(recording)narration.src=recording.src;
  else narration.removeAttribute('src');
  const range=document.getElementById('p-range');range.max=recording?.duration||0;range.value=0;
  document.getElementById('p-len').textContent=fmt(recording?.duration||0);
  document.getElementById('p-heart').setAttribute('aria-pressed',store.get('shine-saved',[]).includes(id));
  updateProg();
}
function paragraphAt(time,times){
  let lo=0,hi=times.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(times[mid]<=time)lo=mid+1;else hi=mid;}
  return Math.max(0,lo-1);
}
function followParagraph(){
  if(openId!==player.id)return;
  const paragraph=document.querySelector(`#r-text p[data-i="${player.i}"]`);
  if(paragraph)paragraph.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function updateProg(){
  const recording=AUDIO[player.id];if(!recording)return;
  const before=player.i;
  const spoken=paragraphAt(narration.currentTime,recording.paragraphs);
  player.i=recording.paragraph_indices?.[spoken]??spoken;
  document.getElementById('p-range').value=narration.currentTime;
  document.getElementById('p-cur').textContent=fmt(narration.currentTime);
  document.querySelectorAll('#r-text p').forEach(p=>p.classList.toggle('speaking',player.playing&&openId===player.id&&+p.dataset.i===player.i));
  if(before!==player.i&&player.playing)followParagraph();
}
function setIcon(){document.getElementById('p-icon').innerHTML=player.playing?'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>':'<path d="M7 4v16l13-8z"/>';document.getElementById('p-play').setAttribute('aria-label',player.playing?'Pause':'Play')}
function play(){
  if(!player.id)openReader(today().id);
  if(!AUDIO[player.id])return;
  const token=++player.token;
  player.playing=true;player.buffering=false;setIcon();syncMusic();
  narration.play().catch(()=>{
    if(token!==player.token)return;
    pause();document.getElementById('p-narrator').textContent='Could not play. Tap play to retry.';
  });
}
function pause(){player.playing=false;player.buffering=false;player.token++;narration.pause();setIcon();syncMusic();updateProg()}
function stop(){pause();narration.currentTime=0;player.i=0;updateProg()}
function jump(d){const recording=AUDIO[player.id];if(!recording)return;const current=paragraphAt(narration.currentTime,recording.paragraphs);const i=Math.max(0,Math.min(recording.paragraphs.length-1,current+d));narration.currentTime=recording.paragraphs[i];updateProg()}
narration.addEventListener('timeupdate',updateProg);
narration.addEventListener('playing',()=>{player.playing=true;player.buffering=false;document.getElementById('p-narrator').textContent=AUDIO[player.id]?.narrator||'AI narration';setIcon();syncMusic();updateProg();followParagraph()});
narration.addEventListener('waiting',()=>{player.buffering=true;syncMusic()});
narration.addEventListener('pause',()=>{player.playing=false;setIcon();syncMusic();updateProg()});
narration.addEventListener('ended',stop);
narration.addEventListener('error',()=>{pause();document.getElementById('p-narrator').textContent='Recording unavailable. Please reload.';});
narration.addEventListener('loadedmetadata',()=>{
  if(Number.isFinite(narration.duration)){
    document.getElementById('p-range').max=narration.duration;
    document.getElementById('p-len').textContent=fmt(narration.duration);
  }
});

/* Original ambient soundscape: softly moving consonant tones, no downloads. */
const music={enabled:store.get('shine-music',true)===true,volume:Math.max(0,Math.min(100,Number(store.get('shine-music-volume',25))||0)),ctx:null,master:null,sleep:null};
function createMusic(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw new Error('Web Audio unavailable');
  const ctx=new Audio();music.ctx=ctx;
  const master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);music.master=master;
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;filter.Q.value=.3;filter.connect(master);
  // A spacious D major pentatonic pad; very slow independent swells avoid a hard loop.
  [146.832,220,293.665,369.994,440,493.883].forEach((frequency,i)=>{
    const gain=ctx.createGain();gain.gain.value=.055;gain.connect(filter);
    const swell=ctx.createOscillator(),depth=ctx.createGain();
    swell.frequency.value=.018+i*.004;depth.gain.value=.022;
    swell.connect(depth);depth.connect(gain.gain);swell.start();
    [-3,3].forEach(detune=>{
      const tone=ctx.createOscillator();tone.type='sine';tone.frequency.value=frequency;
      tone.detune.value=detune;tone.connect(gain);tone.start();
    });
  });
}
async function syncMusic(){
  clearTimeout(music.sleep);
  const active=()=>music.enabled&&music.volume>0&&player.playing&&!player.buffering;
  try{
    if(active()){
      if(!music.ctx)createMusic();
      await music.ctx.resume();
    }
    if(!music.master)return;
    const ctx=music.ctx,param=music.master.gain;
    if(param.cancelAndHoldAtTime)param.cancelAndHoldAtTime(ctx.currentTime);
    else{param.cancelScheduledValues(ctx.currentTime);param.setValueAtTime(param.value,ctx.currentTime);}
    param.setTargetAtTime(active()?music.volume/100*.35:0,ctx.currentTime,active()?.8:.18);
    if(!active())music.sleep=setTimeout(()=>{
      if(!active()&&music.ctx.state==='running')music.ctx.suspend().catch(()=>{});
    },1400);
  }catch(error){
    document.getElementById('music-status').textContent='Music is unavailable in this browser. Narration still works.';
  }
}
function showMusic(open){document.getElementById('music-panel').hidden=!open;document.getElementById('p-music').setAttribute('aria-expanded',open);}
function updateMusicControls(){
  const toggle=document.getElementById('music-toggle');
  toggle.setAttribute('aria-pressed',music.enabled);toggle.textContent=music.enabled?'Music on':'Music off';
  document.getElementById('music-volume').value=music.volume;
}
updateMusicControls();
document.getElementById('p-music').onclick=()=>showMusic(document.getElementById('music-panel').hidden);
document.getElementById('music-close').onclick=()=>{showMusic(false);document.getElementById('p-music').focus();};
document.getElementById('music-toggle').onclick=()=>{music.enabled=!music.enabled;store.set('shine-music',music.enabled);updateMusicControls();syncMusic();};
document.getElementById('music-volume').oninput=e=>{music.volume=+e.target.value;store.set('shine-music-volume',music.volume);syncMusic();};
window.addEventListener('pagehide',()=>{pause();if(music.ctx)music.ctx.suspend().catch(()=>{});});

/* events */
document.addEventListener("click",e=>{
  if(!e.target.closest('#music-panel, #p-music'))showMusic(false);
  const ex=e.target.closest("[data-example]"); if(ex){const box=document.getElementById('mind-text'); if(box) box.value=ex.dataset.example; findTeachings(ex.dataset.example); return}
  const o=e.target.closest("[data-open]"); if(o){openReader(o.dataset.open);return}
  const g=e.target.closest("[data-go]"); if(g){document.getElementById("q").value=""; if(!document.getElementById("reader").hidden){document.getElementById("reader").hidden=true;openId=null} location.hash=g.dataset.go; return}
});
document.getElementById("r-close").onclick=closeReader;
document.getElementById("r-listen").onclick=()=>{if(player.id!==openId) loadTrack(openId); play()};
document.getElementById("p-play").onclick=()=>player.playing?pause():play();
document.getElementById("p-stop").onclick=stop;
document.getElementById("p-back").onclick=()=>jump(-1);
document.getElementById("p-fwd").onclick=()=>jump(1);
document.getElementById("p-range").oninput=e=>{narration.currentTime=+e.target.value; updateProg()};
document.getElementById("p-heart").onclick=e=>{if(!player.id)return; let s=store.get("shine-saved",[]); s=s.includes(player.id)?s.filter(x=>x!==player.id):[player.id,...s]; store.set("shine-saved",s); e.currentTarget.setAttribute("aria-pressed",s.includes(player.id)); if(current==="saved"&&document.getElementById("reader").hidden) go("saved")};
document.getElementById("today-btn").onclick=()=>openReader(today().id);
document.getElementById("surprise").onclick=()=>openReader(TEXTS[Math.floor(Math.random()*TEXTS.length)].id);
document.getElementById("q").addEventListener("input",()=>go(current));
document.getElementById("r-copy").onclick=async e=>{const el=document.getElementById("r-cite");try{await navigator.clipboard.writeText(el.innerText);e.target.textContent="Copied"}catch(err){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent="Selected, press Ctrl/Cmd+C"}setTimeout(()=>e.target.textContent="Copy citation",2200)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("reader").hidden)closeReader()});
function route(){const h=location.hash.slice(1); if(byId(h)){if(!SHELVES.some(s=>s.id===current))go(current); openReader(h,false)} else {document.getElementById("reader").hidden=true; openId=null; go(SHELVES.some(s=>s.id===h)||h==="saved"?h:"home")}}
window.addEventListener("hashchange",route);
const setPH=()=>{
  document.documentElement.style.setProperty("--player-h",document.getElementById("player").offsetHeight+"px");
  document.documentElement.style.setProperty("--nav-h",document.getElementById("rail").offsetHeight+"px");
};
window.addEventListener("resize",setPH);
if(window.ResizeObserver){const layoutObserver=new ResizeObserver(setPH);layoutObserver.observe(document.getElementById("player"));layoutObserver.observe(document.getElementById("rail"));}
document.getElementById("p-disc").innerHTML=pic(today(),200);
route(); setPH();
</script>

</body></html>
