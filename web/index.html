ce—may I see it laid bare!", "བཅོས་སླད་བྲལ་བའི་མཉམ་བཞག་རྒྱུན་བསྐྱངས་ཏེ། །", "chö lé dralwé nyamzhak gyün kyang té", "Sustaining meditation untainted by any trace of alteration,", "བཅོས་མེད་དོན་གྱི་འབྲས་བུ་ཐོབ་པར་ཤོག །", "chömé dön gyi drebu tobpar shok", "May I gain the ultimate fruition free from any fabrication!", "གནས་སྐབས་སུ་ཡང་བསམ་པའི་དོན་ཀུན་འགྲུབ། །", "nekab su yang sampé dön kün drub", "In the meantime, may all my wishes be fulfilled!", "གསོན་པའི་ཚེ་ན་བསམ་པ་ངན་པ་མེད། །", "sönpé tsé na sampa ngenpa mé", "For as long as I live, may I have no negative intentions,", "འཆི་བའི་ཚེ་ན་གནད་གཅོད་སྡུག་བསྔལ་མེད། །", "chiwé tsé na né chö dukngal mé", "And when I die, may I not suffer a painful death,", "ཤི་ནས་འཁྲུལ་སྣང་འཇིགས་སྐྲག་མེད་པར་ཤོག །", "shi né trulnang jiktrak mepar shok", "Having died, may there be no fear of delusory appearances!", "བདག་མཐོང་ཐོས་དང་དྲན་རེག་འགྲོ་བ་ཀུན། །", "dak tong tö dang dren rek drowa kün", "May all who see me, hear me, think of me, or come in contact with me in any way,", "ངེས་འབྱུང་བྱང་ཆུབ་སེམས་དང་ལྷན་ཅིག་སྐྱེས། །", "ngejung changchub sem dang lhenchik kyé", "Develop renunciation, bodhicitta, and co-emergent wisdom", "ཇི་ལྟར་རིགས་པ་ཇི་བཞིན་རྒྱུད་སྐྱེས་ནས། །", "jitar rigpa jizhin gyü kyé né", "In whichever way is appropriate within their minds,", "མྱུར་དུ་རྫོགས་པའི་སངས་རྒྱས་ཐོབ་པར་ཤོག །", "nyurdu dzokpé sangye tobpar shok", "So that, swiftly, they may arrive at perfect buddhahood!", "སངས་རྒྱས་ཉི་མ་མཚན་དཔེའི་ཞལ་མཐོང་ཞིང༌། །", "sangye nyima tsenpé zhal tong zhing", "May I behold the sun-like Buddha with his signs and marks,", "དམ་ཆོས་ཉི་མ་སྙིང་གི་བདུད་རྩིར་སྤྱོད། །", "damchö nyima nying gi dütsir chö", "May I savour the nectar of the sun-like Dharma in my heart,", "དགེ་འདུན་ཉི་མ་ཐར་པའི་གྲོགས་གྱུར་ནས། །", "gendün nyima tarpé drok gyur né", "And may the sun-like Saṅgha accompany me to liberation—", "མཆོག་གསུམ་ཉི་མའི་འོད་དང་མི་འབྲལ་ཤོག །", "chok sum nyimé ö dang mindral shok", "From the light of these three sun-like Supreme Ones, may I never part!2", "སྒྲུབ་པ་པོ་ཉི་མའི་ཐུགས་བཞེད་བཞིན་བཙུན་གཟུགས་དཔལ་དགེས་བྲིས་པའོ། །དགེའོ། །", "To fulfil the wishes of the practitioner Nyima, this was written by Palge, the mere reflection of a genuine monk. May virtue abound!", "Source", "rdza dpal sprul o rgyan ʼjigs med chos kyi dbang po. “bskal mang gong nas sogs.” In gsung ʼbum o rgyan ʼjigs med chos kyi dbang po. Chengdu: Si khron mi rigs dpe skrun khang, 2003. Vol. 8: 355–358.", "Notes", "‘Genuine and wise’ translates (literally) drang srong, the Tibetan translation of the Sanskrit ṛṣi, which is often translated as ‘seer’. ↑", "Here Patrul Rinpoche plays on the word nyima, meaning sun, which is the name of the person who requested the prayer. ↑"]}, {"id": "LH015", "title": "Blissful Path to the Ocean of Bodhicitta", "author": "Dilgo Khyentse Rinpoche", "playlist": "compassion-kindness", "credit": "Translated by Adam Pearcey, 2015. With thanks to Po-yu Sung for providing the Tibetan text and a draft translation.", "url": "https://www.lotsawahouse.org/tibetan-masters/dilgo-khyentse/blissful-path-ocean-bodhichitta", "version": "1.3-20230118", "retrieved": "2026-11-02", "minutes": 6, "paras": ["༄༅།  །བློ་སྦྱོང་སྨོན་ལམ་དོན་བསྡུས་བྱང་སེམས་རྒྱ་མཚོའི་བདེ་ལམ་བཞུགས།", "The Blissful Path to the Ocean of Bodhicitta", "A Brief Prayer of Aspiration for Mind Training", "by Dilgo Khyentse Rinpoche", "འཕགས་མཆོག་སྤྱན་རས་གཟིགས་དབང་དང་། །", "pakchok chenrezik wang dang", "By the truth of the perfect mind of awakening", "སངས་རྒྱས་བྱང་ཆུབ་སེམས་དཔའ་རྣམས། །", "sangye changchub sempa nam", "Generated by the supreme noble Lord Avalokiteśvara", "ཐུགས་སྐྱེད་མཐར་ཕྱིན་བདེན་པ་ཡིས། །", "tuk kyé tarchin denpa yi", "And all the buddhas and bodhisattvas,", "བདག་གཞན་མཁའ་མཉམ་འགྲོ་ཀུན་ལ། །", "dakzhen khanyam dro kün la", "May the supreme mind of bodhicitta be born", "བྱང་ཆུབ་སེམས་མཆོག་སྐྱེ་བར་ཤོག །", "changchub sem chok kyewar shok", "In me and in all other beings, as limitless as space.", "སེམས་ཅན་དུག་ལྔ་ལ་ཞུགས་དང་། །", "semchen duk nga la zhuk dang", "May the causes and effects of beings' suffering—", "རིགས་དྲུག་སྡུག་བསྔལ་མྱོང་བ་ཡི། །", "rik druk dukngal nyongwa yi", "Their involvement with the five poisons,", "སྡུག་བསྔལ་རྒྱུ་འབྲས་བདག་ལ་སྨིན། །", "dukngal gyundré dak la min", "And painful experiences in the six classes,", "བདག་གི་ཕྱིན་དྲུག་སེམས་དང་ནི། །", "dak gi chin druk sem dang ni", "All ripen on me! To them all, as limitless as space,", "དུག་ལྔ་མེད་པའི་དགེ་རྩ་རྣམས། །", "duk nga mepé getsa nam", "I offer the six perfections in my own mind,", "ནམ་མཁའ་མཉམ་པའི་འགྲོ་ལ་སྦྱིན། །", "namkha nyampé dro la jin", "And sources of virtue, free from the five poisons.", "རིགས་དྲུག་འཁོར་བའི་གནས་སྟོང་ནས། །", "rik druk khorwé né tong né", "May all the realms of saṃsāra's six classes be emptied,", "རིགས་མཆོག་དྲུག་གི་སྤྱན་རས་གཟིགས། །", "rik chok druk gi chenrezik", "And may everyone attain the level of Avalokiteśvara,", "ཡེ་ཤེས་དྲུག་ལྡན་ཐོབ་པར་ཤོག །", "yeshe drukden tobpar shok", "In his six sublime families and with six types of wisdom.", "ནད་མུག་མཚོན་བསྐལ་ལོག་པར་བལྟས། །", "né muk tsön kal lokpar té", "May all disease, famine, belligerence, wrong views,", "ཉམས་ཆག་ཉེས་ལྟུང་སྡིག་པའི་ཚོགས། །", "nyamchak nyetung dikpé tsok", "Impairments, transgressions, downfalls, harmful actions,", "གཅེས་འཛིན་བར་ཆད་གདོན་བགེགས་ཀུན། །", "chedzin barché dön gek kün", "Self-cherishing, obstacles, harmful influences and impediments,", "བདག་ཉིད་གཅིག་པུའི་སྟེང་དུ་སྨིན། །", "daknyi chikpü tengdu min", "All ripen on me and me alone!", "ཚེ་དཔལ་ལོང་སྤྱོད་བདེ་སྐྱིད་མཐུ། །", "tsé pal long chö dekyi tu", "And to all these beings, who are as limitless as space", "ཉམས་རྟོགས་མཁྱེན་བརྩེའི་ཡེ་ཤེས་ཀུན། །", "nyamtok khyentsé yeshe kün", "I dedicate long-life, glory, wealth, happiness, power,", "ནམ་མཁའ་མཉམ་པའི་འགྲོ་ལ་བསྔོ། །", "namkha nyampé dro la ngo", "Experience, realisation, and knowing, loving wisdom.", "ཀུན་ཀྱང་བྱང་ཆུབ་སྤྱོད་མཆོག་གིས། །", "kün kyang changchub chö chok gi", "May they all, through supreme enlightened actions,", "རབ་མཛེས་འཕགས་པའི་གནས་ཐོབ་ཤོག །", "rab dzé pakpé né tob shok", "Attain the level of the most splendid Noble One!", "མདོར་ན་གཅེས་འཛིན་རང་འདོད་ལས། །", "dorna chedzin rang dö lé", "In short, may all the causes and effects", "བྱུང་བའི་རྒྱུ་འབྲས་བདག་ལ་སྨིན། །", "jungwé gyundré dak la min", "Of egotism and self-cherishing ripen on me!", "འགྲོ་ཀུན་ཕན་བདེའི་དཔལ་གྱིས་འབྱོར། །", "dro kün pendé pal gyi jor", "And may all beings gain a wealth of benefit and happiness,", "སྟོང་ཉིད་སྙིང་རྗེའི་དོན་རྟོགས་ཤོག །", "tongnyi nyingjé dön tok shok", "And realise the meaning of emptiness and compassion!", "བདག་ལ་མཐོང་ཐོས་དྲན་རེག་གིས། །", "dak la tong tö dren rek gi", "May all beings, especially those who harm me, or who have developed a negative connection", "ངན་འབྲེལ་གནོད་བྱེད་གཙོ་བྱས་འགྲོ། །", "ngen drel nöjé tso jé dro", "Through seeing, hearing, thinking of, or encountering me,", "སྒྲིབ་སྦྱང་བྱང་ཆུབ་ལམ་ཞུགས་ནས། །", "drib jang changchub lam zhuk né", "Purify their obscurations, enter the path to enlightenment,", "ཐོག་མ་ཉིད་དུ་འཚང་རྒྱ་ཤོག །", "tokma nyi du tsang gya shok", "And attain awakening straightaway!", "ཤིན་དུ་མི་བཟད་ལས་ངན་གྱི། །", "shin du mi zé lé ngen gyi", "May I take the place of those experiencing the cause and effect", "རྣམ་སྨིན་རྒྱུ་འབྲས་སྤྱོད་པའི་ཚབ། །", "nammin gyundré chöpé tsab", "Of unbearable, extremely negative acts,", "བདག་ཉིད་གྱུར་ནས་དེ་དག་ཀུན། །", "daknyi gyur né dedak kün", "And may they all purify obscurations", "སྒྲིབ་བྱང་བདེ་ཆེན་ཞིང་སྐྱེ་ཤོག །", "drib jang dechen zhing kyé shok", "And be born in realms of perfect bliss!", "གནོད་བྱེད་གཙོར་གྱུར་འགྲོ་ཀུན་དོན། །", "nöjé tsor gyur dro kün dön", "For the sake of all, but especially those who harm me,", "བདག་ཉིད་ངན་སོང་ཁོ་ནར་གནས། །", "daknyi ngensong khonar né", "May I remain only in the lower realms,", "མ་རྒན་འགྲོ་ཀུན་འཁོར་མཚོ་ལས། །", "magen dro kün khor tso lé", "And may all beings, my very own mothers,", "གྲོལ་ནས་རྣམ་གྲོལ་སར་སྦྱོར་ཤོག །", "drol né namdrol sar jor shok", "Escape samsara's ocean to reach liberation's shore.", "བྱང་ཆུབ་སེམས་ཀྱི་གཞི་གཅིག་པུ། །", "changchub sem kyi zhi chikpu", "The only basis for bodhicitta—", "དགྲ་གདོན་བཀའ་དྲིན་ཅན་ཁྱོད་ཀྱི། །", "dra dön kadrinchen khyö kyi", "Kind enemies and harmful forces—", "ཕྱིར་དུ་བདག་གི་ལུས་དང་སྲོག །", "chirdu dak gi lü dang sok", "For your sake, I shall gladly give away", "དགའ་བཞིན་གཏང་ནས་ཕན་སྒྲུབ་ཤོག །", "ga zhin tang né pen drub shok", "My body and my life—may you be benefitted!", "བདག་ཉིད་མངོན་སངས་རྒྱས་པའི་ཚེ། །", "daknyi ngön sangyé pé tsé", "When I attain complete enlightenment,", "འཁོར་གྱི་ཐོག་མར་ཁྱོད་སྐྱེ་ནས། །", "khor gyi tokmar khyö kyé né", "May you become the first in my circle,", "ལྔ་སྡེ་བཟང་པོ་འདུས་པ་བཞིན། །", "nga dé zangpo düpa zhin", "And, just like the five original disciples,", "མོད་ལ་ཐམས་ཅད་མཁྱེན་ཐོབ་ཤོག །", "möla tamché khyen tob shok", "Attain omniscience there and then!", "འདི་ནས་བྱང་ཆུབ་མ་ཐོབ་བར། །", "di né changchub matob bar", "From now until I attain enlightenment,", "གནོད་བྱེད་ཁྱེད་དང་མི་འབྲལ་ཞིང་། །", "nöjé khyé dang mindral zhing", "May I never be apart from you who do me harm,", "འཁྲུག་པ་མེད་པའི་ལྟ་སྤྱོད་ཀྱིས། །", "trukpa mepé tachö kyi", "And with calm, untroubled view and conduct,", "བྱང་ཆུབ་ལམ་ལ་མཉམ་འཇུག་ཤོག །", "changchub lam la nyam juk shok", "May we set out together on the path to enlightenment.", "མཐོང་ཐོས་དྲན་པ་ལྟ་ཅི་སྨོས། །", "tong tö drenpa tachi mö", "May those who see me, hear me or think of me,", "བདག་གི་མིང་ཙམ་ཐོས་པ་དང་། །", "dak gi ming tsam töpa dang", "And also those who merely hear my name,", "རྫི་ཕྱོགས་རླུང་གིས་རེག་པ་ཡང་། །", "dzi chok lung gi rekpa yang", "Or are simply touched by the same breath of wind,", "སྒྲིབ་ཟད་ཞི་བའི་ལམ་འཇུག་ཤོག །", "drib zé zhiwé lam juk shok", "Discard their obscurations and enter the way to peace!", "ཕ་མར་གྱུར་པའི་མཁའ་ཁྱབ་འགྲོ། །", "pamar gyurpé khakhyab dro", "All beings are my own parents, as limitless as space,", "སྡང་བའི་ཡུལ་དུ་ཇི་ལྟར་འོས། །", "dangwé yul du jitar ö", "So how could I ever feel hostility towards them?", "དྲིན་བཟོའི་བསམ་སྦྱོར་འཇམ་པོ་ཡིས། །", "drin zö samjor jampo yi", "Wishing only to repay their kindness, and acting gently,", "ཕྱམ་གཅིག་སངས་རྒྱས་སར་སྦྱོར་ཤོག །", "chamchik sangye sar jor shok", "May I bring them, all at once, to enlightenment!", "བདག་ལ་བརྟེན་ནས་དངོས་བརྒྱུད་དུ། །", "dak la ten né ngö gyü du", "May beings never be harmed on my account,", "སེམས་ཅན་ཀུན་ལ་གནོད་མ་གྱུར། །", "semchen kün la nö magyur", "Whether directly or indirectly,", "ཕན་དང་བདེ་བ་འབའ་ཞིག་གིས། །", "pen dang dewa bazhik gi", "And, through bringing them only benefit and happiness,", "བདེ་ཆེན་ས་ལ་འགོད་ནུས་ཤོག །", "dechen sa la gö nü shok", "May I lead them all to the state of perfect bliss!", "སྐད་ཅིག་རེར་ཡང་དཔག་མེད་འགྲོ། །", "kechik rer yang pakmé dro", "In each and every instant, may all limitless beings,", "སྒྲོལ་བའི་ཐབས་མཁས་སྙིང་རྗེའི་མཐུ། །", "drolwé tabkhé nyingjé tu", "With skill in the means of liberation and the force of compassion,", "སྤྱན་རས་གཟིགས་དང་འཇམ་པའི་དབྱངས། །", "chenrezik dang jampé yang", "Become just like Avalokiteśvara, Mañjuśrī,", "གསང་བའི་བདག་པོ་ལྟ་བུར་ཤོག །", "sangwé dakpo tabur shok", "And Vajrapāṇi, the Lord of Secrets.", "ཁྱད་པར་གདུལ་དཀའ་སྡུག་བསྔལ་ཅན། །", "khyepar dul ka dukngal chen", "May those who suffer and are difficult to tame,", "ལྷག་པར་བརྩེ་བས་རྗེས་འཛིན་ལ། །", "lhakpar tsewé jedzin la", "Receive special loving care and guidance,", "ཐུབ་པ་མཆོག་དང་པད་འབྱུང་གི །", "tubpa chok dang pejung gi", "And may the compassionate prayers and aspirations", "ཐུགས་སྐྱེད་སྨོན་ལམ་བཞིན་གྱུར་ཅིག །", "tuk kyé mönlam zhin gyur chik", "Of the Supreme Sage and the Lotus Born come true!", "བདག་གཞན་མཉམ་ཉིད་ཡེ་ཤེས་དབྱིངས། །", "dakzhen nyamnyi yeshe ying", "In the wisdom space of the equality of self and other,", "སྟོང་ཉིད་སྙིང་རྗེའི་རྩལ་ཤར་བས། །", "tongnyi nyingjé tsal sharwé", "Through the dawning of emptiness and compassion's power,", "གཞན་ཕན་འབའ་ཞིག་བསྒྲུབ་བྱའི་ཕྱིར། །", "zhenpen bazhik drubjé chir", "Just so the benefit of others may be secured,", "སྨོན་ལམ་བཏབ་བཞིན་མྱུར་འགྲུབ་ཤོག །", "mönlam tab zhin nyur drub shok", "May this prayer of aspiration swiftly be fulfilled!", "ཅེས་རྩོད་དུས་ཀྱི་འགལ་རྐྱེན་བྱང་ཆུབ་ལམ་གྱི་གྲོགས་སུ་མཐོང་བའི་སྨོན་ལམ་འདི་ཡང་འཇམ་མགོན་བླ་མའི་གསུང་གི་བཅུད་བསྡུས་ནས། །རྨད་བྱུང་བྱང་ཆུབ་སེམས་ཀྱི་མངའ་བདག་སྙིགས་མ་པ་རྣམས་ཀྱི་གཙུག་གི་ནོར་བུ་རྫོགས་པའི་སངས་རྒྱས་ཞེ་ཆེན་པའི་བཀའ་དྲིན་ལས་ཐེག་པ་ཆེན་པོའི་ལམ་ལ་མོས་པས་ལྷུར་ལེན་པའི་ཀུ་སཱ་ལི་རྒྱལ་བའི་སྲས་པོ་བློ་གྲོས་དྲི་མེད་གཟི་བརྗིད་རབ་ཏུ་དགའ་བའི་དཔལ་གྱིས་བྲིས་ཤིང་ཁ་ཏོན་དུ་བགྱིས་པ་ལྟར་འགྲུབ་པར་གྱུར་ཅིག། །།", "This aspiration prayer for seeing adverse conditions as supports on the path to enlightenment encapsulates the words of the Jamgön Lama1 and was written by Lodrö Drimé Ziji Rabtu Gawé Pal, a mendicant heir to the victorious buddhas, who ardently and devotedly follows the Mahāyāna path, as a result of the kindness of the perfect buddha of Shechen (i.e., Shechen Gyaltsab), who was a master of wondrous bodhicitta and a crowning jewel for beings in this degenerate age.", "Source", "bkra shis dpal 'byor. “blo sbyong smon lam don bsdus byang sems rgya mtshoʼi bde lam.” In gsung ʼbum rab gsal zla ba. Delhi: Shechen Publications, 1994. Vol. 23: 243–246", "Notes", "A reference to The Gateway to the Ocean of Bodhicitta (byang sems rgya mtsho'i 'jug ngogs) by Jamgön Kongtrul Lodrö Thayé. ↑"]}, {"id": "LH016", "title": "Advice for Meditating on Impermanence", "author": "Könchok Tenpe Drönme", "playlist": "change-loss-impermanence", "credit": "Translated by Tenzin Jamchen (Sean Price) and edited for Lotsawa House by Adam Pearcey (based on an earlier version translated by Tenzin Jamchen and edited by Tenzin Russell), 2015.", "url": "https://www.lotsawahouse.org/tibetan-masters/konchok-tenpe-dronme/verses-of-advice-for-meditating-on-impermanence", "version": "1.3–20200702", "retrieved": "2026-11-02", "minutes": 9, "paras": ["Verses of Advice for Meditating on Impermanence", "by Könchok Tenpe Drönme", "Within the sky-sphere of marvellous, great bliss,", "Your cloud-like forms gather to train sentient beings,", "Showering down rains of teachings, profound and vast—", "To you, the holy gurus, I bow and prostrate.", "This fortunate birth, which is obtained but once,", "Is liable to slip from our grasp without bearing fruit.", "So traverse the path to liberation while you can,", "And for that, let this whip of advice spur you on!", "Thoughts that we might finish this life’s tasks,", "Within just a single month or year,", "Only then to practise Dharma well", "Are like harmful spirits that deceive us.", "The tasks of this life are like ripples on water:", "Fresh ones arising just as others fade away.", "Even as we finish them, they continue to increase.", "Wouldn’t it be better just to make them all cease?", "Before tomorrow’s Dharma practice can arrive,", "There’s a danger death will come to us today.", "Thus, if we wish to practise the Dharma,", "Let us, without self-deception, begin right away!", "Although buddhas and bodhisattvas came in the past,", "Their activities pervading throughout the three realms,", "Now they are no more, and only their names remain,", "Still, in this they are teachers of impermanence.", "Though kings and ministers, proud of their power and wealth,", "Wrought chains of history, so great and so wondrous,", "Unexamined, it all seems so real and so concrete,", "Yet, throughout the three realms, not a trace remains.", "Friends from the past, similar to us in age and strength,", "Have been taken, all of a sudden, by the Lord of Death,", "So with what confidence can we possibly claim", "That we shall not fear when death’s time arrives?", "Even sheep, among the most foolish of creatures,", "Are alarmed when seeing their fellows butchered.", "So, failing to apply their example to ourselves,", "Are we not more insensible than such beasts?", "That this body’s nature is to die at a time uncertain", "Can be understood without reference or citation.", "But if with bare senses you still do not see it,", "Then surely “idiot” must be your designation!", "This gathering of dear ones, servants and dependants,", "Is like a mound formed of leaves fallen from a tree—", "A gust of wind will scatter them through hill and vale,", "And, once dispersed, they’ll never converge again.", "People from different places crowded in a market", "Are like the bees gathered at the end of autumn,", "Dispersing no sooner than they’ve come together:", "A teaching on transience for those of understanding.", "Take the outer world of the elements as an example –", "Don’t be deceived by labels of ‘summer’ and ‘winter’–", "It too does not last, and with each ten days that pass,", "The mountains and river valleys change their colours.", "Blue spring water ripples like a dancer,", "And makes pleasant music with its flow,", "But when gripped by winter’s icy chill,", "Can only whisper, as if sobbing in sorrow.", "How pleasant the meadow with its flowers,", "As it dances to the singing of the bees,", "But all turns to lament and desolation,", "When autumn brings fierce frost and hail.", "The cord of life is as fragile as a rope of straw,", "On which two mice—day and night—do gnaw,", "And with each and every moment that goes by,", "Our meeting with Death, the enemy, draws nigh.", "When a child, young and bright, can sicken unto death,", "To be mourned by parents whose hair is white as conch,", "And whose backs are hunched over, bent like a bow,", "Who then dares to say it’s the old who are first to go?", "Struck by adversity, as when a crop is stung by hail,", "The rich man may lament his loss and sorry situation,", "But his cries for help will likely go unanswered,", "Even by the poor servants he cared for in the past.", "Today’s ally can transform into tomorrow’s foe,", "As unguarded words are often misconstrued;", "Yet this can provide a teaching that’ll put an end", "To false notions of distant enemy, intimate friend.", "Samsaric riches are deemed fortune in abundance,", "But, as a burning lamp is as if a palace to a moth,", "Their alluring appearance serves only to deceive,", "And to lead us from the real happiness that lasts.", "In brief, the Lord of Death will soon arrive—", "That is certain—even if the time’s unknown.", "And when he comes, there’ll be no escape:", "For as you’re caught in his dreadful fangs,", "Even the body you’ve known for so long", "Must remain in its bed, as you go on alone,", "Denied even so much as a backward glance", "At your wealth, your friends or your servants.", "All help towards allies, all bettering of foes,", "Carried out so tirelessly throughout this life,", "Must now be abandoned for the final journey,", "The only baggage? Your virtues, your flaws.", "Then, on the intermediate stage’s unfamiliar path,", "You’ll face the army of the dreaded Lord of Death,", "And, deceived by samsara’s fortunes, you’ll be lost,", "For, even seeing your mistakes, regret is futile then.", "The Dharma is your guide on a path unknown,", "The Dharma is your food on a journey, arduous and long,", "The Dharma is your protector in a dangerous realm,", "So engage in Dharma—with body, speech and mind—from now on.", "If, at this time, when you have the power", "For ultimate happiness, you don’t build a safe base,", "What will you do as you draw your final breath,", "And your hysterical mind finds no resting place?", "This is a song of impermanence, a meditation,", "“A Great Light for the Middle Way’s Illumination”,", "It’s purpose is to strengthen the mind’s determination", "For Dharma", "From the start, in the middle, to Ultimate Liberation.", "As one’s mind becomes well inclined towards Dharma", "Many paths make claims to be profound,", "But the authentic tradition of the Victor Lobzang Drakpa", "Shows the essential intention of each puissant Buddha.", "From oral explanation and deep meditation", "Of the teachings of sūtra and tantra,", "Know the path well, in all of its aspects,", "Fully intact, without error,", "And then every day, without interruption,", "Create positive imprints with firm meditation.", "Right from the preliminaries until the conclusion,", "Perform well the words of Jé Lama—", "Thereby you’ll take the very heart-essence", "Of this life of fortunes and endowments.", "By the strength of the merit accumulated thus,", "May the thief of the view of self permanence", "Lose all its power to grasp true existence,", "And may all reach the realm of the deathless.", "Thus, Zhabdrung Ngawang Drakpa, whose positive tendencies from the past continue to increase, sent a letter requesting advice in verse on how to meditate on impermanence. He accompanied this request with gifts such as shrine articles for the maṇḍala of eleven-faced noble Avalokiteśvara and an auspicious silken scarf. In response, the venerable Könchok Tenpe Drönme composed this in a straightforward manner which is easy for everyone, high or low, to understand, which is unconstrained by poetic convention, synonymy and the like, and which takes the advice of past saints as a basis. May this be a cause of everyone turning their minds towards the Dharma!"]}, {"id": "LH017", "title": "Flowers Ravaged by the Frost", "author": "Jamyang Khyentse Chökyi Lodrö", "playlist": "change-loss-impermanence", "credit": "Translated by Adam Pearcey with the generous support of the Khyentse Foundation and Tertön Sogyal Trust, 2021.", "url": "https://www.lotsawahouse.org/tibetan-masters/jamyang-khyentse-chokyi-lodro/flowers-ravaged-by-frost", "version": "1.3–20240404", "retrieved": "2026-11-02", "minutes": 3, "paras": ["When Flowers Were Ravaged by the Frost", "by Jamyang Khyentse Chökyi Lodrö", "Noble guru, unique embodiment of the Three Jewels,", "The unfailing sources of refuge,", "Let your lotus feet adorn my crown.", "Turn my mind towards the Dharma!", "During the bountiful period of the harvest moon,", "Flowers, originating from the kingdom of Nepal,", "Appeared in a rich array of colours,", "Each as beautiful as an attractive girl,", "Inspiring a hundred joys and offering solace and delight", "To the eyes and minds of all, wise and foolish alike—", "Such a vast profusion of perfect splendour!", "Then, in the dark night of the twenty-eighth", "Of that month of autumn there arose", "The radiant daughter of a clear silver sky,", "The bright-faced goddess of the constellations,", "Who brought the fresh scent of morning dew", "And at dawn placed hats of white", "Upon the heads of all the flowers,", "So that, in the rising sun, they withered.", "Their leaves and petals all drooped,", "Their necks no longer supported their crowns,", "And they resembled the corpses of the dead.", "This example illustrates impermanence:", "How the glamour of youth is overcome", "By the armies of passing months and years,", "And how in the Lord of Death’s expansive dark", "Countless yamas of deluded perception appear", "As a frost that ravages the flowers of cherished bodies,", "Makes their heads droop, their lower lips sag,", "And their limbs turn rigid and hard as wood.", "There is no doubt that such severe horrors", "Will swiftly come to pass.", "And as this is more than my heart could bear,", "I must apply myself to the Dharma right away,", "Or else be left without recourse.", "Now, therefore, while I have the freedom,", "Let me not succumb to laziness or indolence.", "And, as I set the great fires of diligence ablaze,", "Inspire me with your blessings,", "So that I may burn the thicket of the afflictions", "And swiftly escape the fiery pit", "Of saṃsāra, so difficult to traverse.", "You, my noble father-guru, care for me!", "When an array of flowers was ravaged by the frost, I wrote this sorrowful song by reflecting upon impermanence."]}, {"id": "LH018", "title": "Heart Advice in Four Lines", "author": "Dilgo Khyentse Rinpoche", "playlist": "change-loss-impermanence", "credit": "Rigpa Translations.", "url": "https://www.lotsawahouse.org/tibetan-masters/dilgo-khyentse/heart-advice-do-not-forget", "version": "2.2-20220516", "retrieved": "2026-11-02", "minutes": 1, "paras": ["༄༅། །ཞལ་གདམས་མདོར་བསྡུས་ནི།", "Heart Advice in Four Lines", "by Dilgo Khyentse Rinpoche", "བླ་མ་མ་བརྗེད་རྟག་ཏུ་གསོལ་བ་ཐོབ། །", "lama ma jé tak tu solwa tob", "Do not forget the guru;\nPray to him1 at all times.", "རང་སེམས་མ་ཡེངས་རང་ངོ་རང་གིས་ལྟོས། །", "rang sem ma yeng rang ngo rang gi tö", "Do not let your mind be distracted;\nLook into its very essence.", "འཆི་བ་མ་བརྗེད་ཆོས་ལ་བསྐུལ་མ་ཐོབ། །", "chiwa ma je chö la kul ma thob", "Do not forget death;\nLet it spur you on to Dharma.", "སེམས་ཅན་མ་བརྗེད་སྙིང་རྗེ་བསྔོ་སྨོན་གྱིས། །", "semchen ma je nyingje ngo mön gyi", "Do not forget sentient beings;\nWith compassion dedicate your merit to them and make prayers of aspiration.", "ཅེས་དད་ལྡན་ཀུན་བཟང་ངོར་མངྒ་ལས་སོ།།", "Written for the devoted Kunzang by Maṅgala.2", "Source", "bkra shis dpal 'byor. \"bla ma ma brjed sogs/\" in gsung 'bum/_rab gsal zla ba. 25 vols. Delhi: Shechen Publications, 1994. Vol. 3: 267b", "Notes", "Or her. The Tibetan is gender neutral. ↑", "In Nepal, June 4th 1989. ↑"]}, {"id": "LH019", "title": "Brief Introduction to the Bardos", "author": "Patrul Rinpoche", "playlist": "grief-death", "credit": "Translated by Adam Pearcey, 2010. With gratitude to Alak Zenkar Rinpoche, who kindly clarified many points of the text.", "url": "https://www.lotsawahouse.org/tibetan-masters/patrul-rinpoche/bardo-introduction", "version": "1.4–20220831", "retrieved": "2026-11-02", "minutes": 11, "paras": ["A Brief Introduction to the Bardos", "by Patrul Rinpoche", "Generally, whenever physically embodied beings die, they first experience the twenty phases of coarse dissolution, which are as follows:", "As the aggregate of form dissolves, the limbs twitch, and the body loses its strength and power.", "As the mirror-like wisdom dissolves, the mind grows unclear and hazy.", "As the earth element dissolves, the body grows dry.", "As the eye faculty dissolves, sight becomes unclear and the eye takes on a rounder shape.", "As the object form dissolves, the body loses its vitality and weakens.", "As the aggregate of sensations dissolves, the dying person can no longer detect feelings.", "As the wisdom of equality dissolves, there is no longer any awareness of the three types of sensation (i.e., pleasant, painful or neutral).", "As the water element dissolves, the lips, sweat, urine, semen and ovum all dry up.", "As the ear faculty dissolves, external and internal sounds can no longer be heard.", "As the object sound dissolves, the sounds of the body itself can no longer be heard.", "As the aggregate of perception dissolves, it is no longer possible to distinguish between different creatures.[1]", "As the wisdom of discernment dissolves, the dying person forgets the names of his or her own parents, siblings or children.", "As the fire element dissolves, proper digestion of food is no longer possible.", "As the nose faculty dissolves, upper respiration[2] slows.", "As the object smell dissolves, the person can no longer detect the odours of their own body.", "As the aggregate of formations dissolves, the person is unable to carry out physical activities.", "As the all-accomplishing wisdom dissolves, the person can no longer remember ordinary mundane tasks or their purpose.", "As the wind element dissolves, the ten internal winds shift from their usual locations.", "As the tongue faculty dissolves, the tongue feels thicker and shorter than usual and turns blue at its base.", "As the object taste dissolves, the person can no longer detect the six kinds of taste.", "Following the twenty coarse forms of dissolution, which unfold in this way, comes the process of subtle inner dissolution:", "As earth dissolves into water, the person is unable to move the body and can no longer maintain its strength.[3] It feels as if the body is sinking into the ground. As an inner sign, there is a shimmering expanse of blue, and the impression of softly drizzling rain and flowing water.", "As water dissolves into fire, the mouth and nostrils dry up, and the tongue becomes lodged against the palate. As an inner sign, there is an appearance of a smoky haze swirling on a plain.", "As fire dissolves into wind, the body loses heat in its extremities, and the stomach’s digestive energy grows weaker. As an inner sign, shimmering red sparks crackle and flicker like fireflies.", "As wind dissolves into consciousness, exhalations become longer, and, as the coarse outer breathing ceases, the person is unable to inhale. As an inner sign, there is a vision of a burning lamp, and many torches arranged in a row.", "As consciousness dissolves into space, as an inner sign, awareness is very clear, and as an outer sign, there is an experience like the sky devoid of clouds.[4]", "Then, as space dissolves into luminosity, four visions gradually unfold:", "The white essence obtained from the father descends from the crown, and when it reaches the heart there is what is called ‘appearance’. As an outer sign, this is accompanied by an experience of whiteness, as when moonlight fills a completely clear sky that is entirely free from clouds. As an inner sign, there is a clear experience of the self-clarity of consciousness devoid of any coarse thought states focused on perceived objects.", "As the subtle red element of the mother ascends from the base of the central channel, the wisdom of appearance fades into ‘increase’. As an outer sign, a red vision unfolds like a cloudless sky pervaded by sunlight. As an inner sign, there is an extremely clear state of mind devoid of any coarse thought states focused on the perceiving subject.", "As the subtle white and red essences meet at the heart, the wisdom of increase dissolves into ‘attainment’. Through this, as an outer sign, there is an experience of blackness, like the thick darkness which falls when the sky turns completely black. As an inner sign, extremely subtle thoughts involving perceived objects and perceiving subject become completely absent, and all distinct concepts based on the appearance aspect of mind fade away, so that, as the ordinary dualistic mind ceases, the wisdom of attainment dawns.", "When the subtle essences of blood and breath, the bindus A and HAṂ[5] and so on, which are inside the white, silken thread-like channel in the heart, all dissolve completely, the ground luminosity of the moment of death arises. As an outer sign, there is an experience of emptiness and clarity without centre or periphery, like a cloudless sky when it is completely clear. As an inner sign, you remain in co-emergent, non-conceptual wisdom that is entirely without elaboration. If, having recognized this, you can settle into an ongoing experience of the present moment, mother and child luminosities will meet together, and you will be liberated in the first bardo.", "In this context, empty luminosity is explained according to the general approach of the tantras, whereas how the forms of the deities arise out of clear light, how the tikles of light and so on appear are explained in the Dzogchen tantras. Nevertheless, it would seem to be rare for these to unfold in a way that provides an opportunity for liberation.[6]", "Next, out of the luminosity into which the three visions dissolved, appearances unfold gradually once again, and the body of the bardo of becoming is formed. For the first half of this bardo, however long that might be, you have the form of your preceding life, and for the second half you take on the appearance of your eventual rebirth. All sensory faculties are intact, and you can travel anywhere but the mother’s womb, miraculously and without obstruction. You are invisible to all except those of the same class (i.e. other bardo beings) and those who have obtained divine vision. Since you have taken on something like a body in a dream, for example, which is generated in an instant, and knows neither light nor complete darkness, this is known as the ‘bardo of semi-darkness’.", "It is difficult at this time to realize that you have died, so certain indications that you are in the bardo have been taught. For instance, you do not see the sun or moon when looking into the sky, and you leave no footprints and cast no shadow.", "All manner of experiences, both positive and negative, arise at this stage, as a result of both good and bad karma. In particular, there are the four so-called ‘fear-inducing sounds’, which are:", "the sound of a mountain collapsing, which comes from earth prāṇa,", "the sound of waves crashing in the ocean, which comes from water prāṇa,", "the sound of fire ravaging a forest, which comes from fire prāṇa, and", "the sound of a thousand simultaneous claps of thunder, which comes from wind prāṇa.[7]", "The so-called ‘three terrifying abysses’ are the three white, red and black abysses which are the spontaneous forms of the three poisons. When seeing them and falling into them, you enter the womb.", "This is also the stage at which you undertake a search for a birthplace, feel craving for a home and a body, and so on. Various visions, which are indications of the entrance to a birthplace can occur, with appearances such as wheels of light, caves, empty hollows, male and female animals, male and female human beings and so on.", "At these times, the crucial points of practice are as follows:", "At first, when you are certain that you are going to die, you must cut all ties and attachment to this life. Confess from the depths of your heart any downfalls and breakages of samaya, harmful actions and so on. Devote not even so much as a single moment to feeling guilty about your own negative actions, fearing death, or being attached to this life. Instead, feel happiness and joy, and say to yourself: “Now I shall recognize the clear light at death. Or, if that is not possible, since I shall certainly use the bardo as an opportunity to travel to a pure realm such as Akaniṣṭha, Zangdokpalri or Sukhāvatī, I shall be joyful.” Maintain, without ever letting it slip away, the strong intention and thought “I shall travel to the pure realms!”", "Gently, in a relaxed way, as you settle into an experience of whichever practice is the clearest and most vivid for you, let go of the constituents of this life. Since you will be unable to practise any unfamiliar pith instructions, rely only on those practices which are clearest for you at the moment. These two points—settling into a practice in this way, and aspiring to travel to a pure land such as Zangdokpalri—are unsurpassable. In particular, it is absolutely crucial that you repeatedly form the intention to travel to the pure land of your choosing. It is exceptionally important to understand that even now, both day and night, you must never let go of this thought."]}, {"id": "LH020", "title": "Advice for a Dying Practitioner", "author": "Dodrupchen Jigme Tenpe Nyima", "playlist": "grief-death", "credit": "Translated by Adam Pearcey, 2006. Dedicated to the memory of Ian Maxwell.", "url": "https://www.lotsawahouse.org/tibetan-masters/dodrupchen-III/advice-dying-practitioner", "version": "1.4–20220817", "retrieved": "2026-11-02", "minutes": 5, "paras": ["You will need to make preparations before the time comes to pass away. There are many aspects to this, but I will not go into too much detail here. Briefly, then, this is what you should do as you approach the time of death.", "Think to yourself again and again: “Whether death comes sooner or later, ultimately there is no alternative but to give up this body and all my possessions. This is just how it is for the world as a whole.” Thinking along these lines, sever completely the bonds of desire and attachment. Confess all the harmful actions you have committed in this and all your other lives, as well as any downfalls or breakages of vows you may have incurred, wittingly or unwittingly, and make repeated pledges never to act in such a way in future.", "Don’t feel nervous or apprehensive about death. Try instead to raise your spirits and cultivate a clear sense of joy, bringing to mind all the positive, virtuous things you have done in the past. Without feeling any trace of pride or arrogance, celebrate your achievements over and again. Dedicate all your merits and make repeated prayers of aspiration, so that in all your future lives you may be able to take to heart the complete path of the supreme vehicle, with the guidance of a virtuous spiritual friend, and with qualities such as faith, diligence, wisdom and conscientiousness—in other words, all the most perfect circumstances, both outer and inner. Pray too that you never fall under the influence of evil companions or destructive emotions.", "The texts of the Vinaya explain that one of the principal causes for taking a supreme form of rebirth, as one who leads a disciplined life in the presence of the Buddha for example, is to make prayers and aspirations at the moment of death. This is why it is said that ‘whatever is the closest and whatever is the most familiar’ will have tremendous power.[1]", "Any aspirations you make should be given additional impetus by making determined pledges such as this: “In all my lives, I will do all that I can to train on the path of emptiness with compassion as its very essence!” To appreciate the importance of this, consider how much more effective it is to say strongly to yourself, “I will wake up early in the morning!” than simply to make the aspiration “May I wake up early.”", "In order to accomplish more easily whatever prayers you have made or intentions you have formed, it is profoundly beneficial to rely upon an embodiment of spiritual power. Bring to mind therefore the one for whom you have the greatest devotion, or to whom you feel the deepest connection through your practice, whether it is the great and glorious master of Oḍḍiyāna, Guru Rinpoche, or Noble Avalokiteśvara, the Lord of the World, and, with the confident trust that he or she is the embodiment of all the precious sources of refuge, pray one-pointedly for the fulfilment of your aspirations.", "At the actual moment of death it will be difficult to gather sufficient strength of mind to meditate on something new or unfamiliar, which is why you must choose an appropriate meditation beforehand and train until you are familiar with it. Then, as you pass away, you should devote your thoughts to the meditation as much as you possibly can, whether it is remembering the Buddha, focusing on the feeling of compassion, cultivating the view of śūnyatā, or remembering the Dharma or the Saṅgha. In order for this to happen successfully, it is also important that you train yourself beforehand to think, “From now on, as I pass through this critical juncture of the time of death, I will not allow any negative thoughts to enter my mind.”", "The saints of the past had a saying: “Better than plenty of virtuous activity done with a dull and clouded mind is just a single day’s virtuous action done with mental clarity.” As this says, if you practise all this having first made every effort to develop a sense of inspiration and joy, it will be that much more effective.", "Even though it is difficult for the likes of me to benefit others, I will recite the verses of refuge and pray that in all your future lives you may follow the Mahāyāna teachings.", "Written by the one called Fearless (Jigme)."]}, {"id": "LH021", "title": "Advice on Remembering Parents", "author": "Khyenrab Chökyi Özer", "playlist": "family-friends", "credit": "Translated by Adam Pearcey, 2020.", "url": "https://www.lotsawahouse.org/tibetan-masters/khyenrab-chokyi-ozer/advice-remembering-parents", "version": "1.1–20210621", "retrieved": "2026-11-02", "minutes": 5, "paras": ["Advice on Remembering One’s Parents", "by Öntö Khyenrab Chökyi Özer", "At first, your parents are kindest for giving you human form.", "Then, the guru is kindest for presenting the divine Dharma.", "Ultimately, you must show yourself the greatest kindness,", "So always devote your body, speech and mind to Dharma.", "If you remember your parents, exert yourself in Dharma.", "All who take birth must by their nature come to die.", "All meeting must inevitably end in separation.", "And at death nothing but Dharma is of any benefit.", "If you remember your parents, try to repay their kindness right away.", "Teach them to adopt virtue, avoid harm, and set out upon the path.", "Whatever virtues you have accumulated, dedicate them all to them,", "Because you cannot repay their kindness with anything but Dharma.", "If you remember your parents, avoid non-dharmic actions.", "Trading and farming are unfit for those who’ve renounced household life.", "In bustling distraction you’ll fail to accomplish your own and others’ aims.", "And there’s nothing worse in this world than one who’s reckless and rash.", "If you remember your parents, stay relaxedly at home.", "Too much travel brings all manner of distraction.", "Too much talk sets the whole world against you.", "Having many plans leads to nothing but failure and ruin.", "If you remember your parents, regard everyone as a mother or father,", "Friends and allies are your parents; bitter enemies are your parents too.", "The guru is your parent, and your dharma friends are parents as well.", "There’s not a single living being who’s not been your mother or father.", "If you remember your parents but fail to recognize their kindness,", "Then exert yourself in the study of the texts of learned scholars,", "And receive profound instructions, the words of sublime teachers.", "Or else a hundred years might pass and still you would not know.", "If you remember your parents, always be conscientious.", "All virtuous practice derives from conscientiousness.", "And without such care you’ll repay kindness wrongly.", "There’s nothing worse in this world than an insensitive fool.", "If you remember your parents, lasso them with compassion.", "Receive the profound secret mantra with the mind of awakening,", "Let the nectar of sacred Dharma heal the blow of self-clinging,", "And you’ll have no regrets about failing to repay kindnesses.", "If you remember your parents, lift your head through study and reflection.", "With dedicated application, tighten the belt of method and wisdom.", "Leave the house of self-based views behind and flee to the plains of selflessness.", "Even if the fields beyond saṃsāra are empty, you’ll have no regrets.", "If you remember your parents, seek the solitude of the mountains.", "Cultivate the four boundless emotions for your parents among the six classes.", "Let the child be captivated by the heroic father-guru’s life of liberation,", "And never be apart from the mother-goddess of blissful clarity.", "If you remember your parents, train in the mind of awakening,", "And meditate constantly on the path of two profound stages.", "When realization eventually manifests,", "You’ll never lack profound means and wisdom.", "If you remember your parents, look into your own mind.", "Your father is clarity, your mother the nature of emptiness.", "Inexpressible emptiness-clarity is mind’s basic character.", "From this indivisible clarity and emptiness, there is no separation.", "Ha! Ha! It is the father and it is also the mother.", "It’s one, indivisible, and yet is divided into two.", "When you think about this and how flexible it is,", "How funny that all phenomena are just the same!", "When applying the sevenfold reasoning of the chariot,", "Clinging to parents as real dissolves into limitless space.", "Beyond expression, the child takes the great empty path.", "And in basic space, beyond mind, there’s no father or mother.", "In reply to Lodrö Namgyal, a monk from Dungdo, who said that he sometimes feels sadness and regret when remembering his parents and that he needed some brief advice on how to deal with this, Lodrö Lekshé Gyatso playfully wrote down whatever came to mind."]}, {"id": "LH022", "title": "Thirty Pieces of Heart Advice", "author": "Longchen Rabjam", "playlist": "simplicity-what-matters", "credit": "Translated by Daniela Hartmann and edited by Judith Amtzis, Jacqueline Bourbon and Monsieur “Fifi” Greywhiskers, 2014.", "url": "https://www.lotsawahouse.org/tibetan-masters/longchen-rabjam/30-stanzas-of-advice", "version": "1.3–20240909", "retrieved": "2026-11-02", "minutes": 11, "paras": ["From his great clouds of prayers arising through wisdom, which permeates the dimension of reality completely, and through the sunrays of compassion, amṛta falls down unceasingly onto the field of students, ripening the offshoots of the three kāyas. I bow down at the feet of the lama, who protects as the embodiment of the Three Jewels.", "Though I entered the sacred lineage of accomplishment through the power of my prayers, due to my lack of effort my life has turned out meaningless and is now vanishing. I had wanted to act in an honest manner, but now I am in despair and have seen many like me. Out of renunciation I composed these thirty pieces of heart advice.", "1. Kyeho! Drawing a large following by employing a variety of methods", "Although we accumulate the right facilities to establish a monastery,", "This will become a field of dispute causing attachment.", "‘To remain alone’ is my heart advice.", "2. Performing village rites, like taming demons of dead children and the living,", "Peddling our qualities as merchandise amidst the people", "Out of attachment to food and wealth, we get carried away by the demons of the mind.", "‘To tame one’s own mind’ is my heart advice.", "3. By gathering donations from the poor as if imposing taxes,", "We can erect large statues and distribute offerings on a vast scale.", "But even though this is to support virtuous goals, we instigate others to commit negative actions.", "‘To keep one’s mind virtuous’ is my heart advice.", "4. Teaching others Dharma out of a desire for greatness and", "Maintaining a retinue of important and humble people through skilled methods—", "A mind involved with this is the source of pride.", "‘To have few aspirations’ is my heart advice.", "5. Were we to offer a hundred valuable things accumulated through wrong livelihood,", "Based on conducting business, taking interest, deception and so on.", "We might attempt to be virtuous, but instead give rise to the eight worldly dharmas.", "‘To meditate on renunciation’ is my heart advice.", "6. Through taking on responsibility, bearing witness, enforcing the law and so on,", "We reconcile people in their disputes, thinking this benefits them,", "But still, aversion and attachment arise.", "‘To be without hope and fear’ is my heart advice.", "7. To have subordinates, wealth, a retinue, good fortune and", "Fame spreading through the whole world –", "At the time of death all this is of no benefit.", "‘To be diligent in one’s practice’ is my heart advice.", "8. Even though caretakers, attendants, people in charge and cooks", "Constitute the lifeblood of a monastery,", "Entertaining dualistic perception is the cause for strife.", "‘To give up such chores’ is my heart advice.", "9. To carry whatever we think necessary to the cave,", "Statues, offerings, texts, cooking utensils and the like,", "All hastily gathered together, leads to suffering and dispute.", "‘To be frugal’ is my heart advice.", "10. Pointing out faults to a short-tempered retinue", "In these degenerate times, even with the wish to benefit,", "Gives rise to negative states of mind.", "‘To speak peacefully’ is my heart advice.", "11. Giving advice with a wish to benefit and without self-interest,", "Or lovingly pointing out someone’s hidden faults,", "We might be honest, but still it creates heartache.", "‘To speak pleasantly’ is my heart advice.", "12. When we support our own side and refute the other,", "We might think this is the way to propagate the teachings during debate,", "But instead it will give rise to negative states of mind.", "‘To stop talking’ is my heart advice.", "13. Through being partial towards our lama, lineage and practice,", "We believe we are upholding them.", "But to praise our own side whilst disparaging others is the source of attachment and aversion.", "‘To give all this up’ is my heart advice.", "14. After differentiating and examining the teachings we have studied,", "We find faults in the teachings of others and might believe this to be wisdom.", "But through this we accrue negative deeds.", "‘To train in pure view’ is my heart advice.", "15. Speaking about blank emptiness and disregarding cause and effect,", "Thinking that non-action is the ultimate,", "We give up the two kinds of accumulation, leading to the deterioration of our practice.", "‘To practice unifying both’ is my heart advice.", "16. We let the innermost essence descend for the sake (of practicing) the third (empowerment),", "Thinking we enhance our practice by relying on a consort.", "Yet many have been deceived by such contaminated ways.", "‘To practice the path of liberation’ is my heart advice.", "17. To bestow empowerments upon improper people,", "And to distribute sacred substances among the ordinary", "Is the basis for slander and the deterioration of samaya.", "‘To start in the proper way’ is my heart advice.", "18. To be naked and so on in the middle of ordinary people—", "We might think of such eccentric behaviour as part of higher asceticism,", "But it is a reason for worldly beings to lose faith in what is pure.", "‘To act with mindfulness’ is my heart advice.", "19. Aspiring to be someone superior where we reside,", "Even if we act purely and are learned,", "Is the cause to fall from the highest point to the lowest.", "‘To be neither too tight nor too loose’ is my heart advice.", "20. In villages, monasteries, caves and such places—", "Wherever we might stay—let us not look for close friendship,", "But with whomever we become acquainted, be neither too intimate nor too hostile.", "‘To remain self-reliant’ is my heart advice.", "21. In order to receive provisions from the faithful,", "We might pay respect in a hypocritical way", "To attract attention, but that will only fetter us.", "‘To act regarding everything as equal’ is my heart advice.", "22. There are many texts on craft, astrology and medicine,", "All sources for understanding the methods of interdependence,", "Yet to know too many things ruins one’s meditation.", "‘To limit the objects of knowledge’ is my heart advice.", "23. To replicate the arrangements of the home,", "When venturing into solitude", "Is to waste one’s life in a meaningless manner.", "‘To give up too many activities’ is my heart advice.", "24. There might be excellent qualities in striving", "For learnedness and purity,", "But whatever we are attached to will only bind the mind stream.", "‘To be without bias’ is my advice from the heart.", "25. Summoning hail and thunderbolts and the like, producing black magic spells and protecting oneself,", "We might believe these are activities to subdue those who are hardest to tame,", "But this will only inflame their minds and lead us to the lower realms.", "‘To take a humble place’ is my heart advice.", "26. To amass a multitude of profound texts", "Such as scriptures, commentaries and oral instructions,", "Without practicing them, will be of no benefit at the time of death.", "‘To watch your mind’ is my heart advice.", "27. When we accomplish remaining one-pointedly, we can gain insights and understanding,", "But to write spiritual texts and songs of realization about them,", "Even though they are signs of experience, will give rise to conceptualization.", "‘To maintain a non-conceptual frame of mind’ is my heart advice.", "28. When conceptual thoughts arise, the direct view is crucial;", "Having examined the mind, to settle it is crucial;", "Even as there is nothing to meditate on, to meditate is crucial.", "‘To remain undistracted’ is my heart advice.", "29. Dwelling in the state of emptiness, acting according to (the law of) cause and effect;", "Realizing non-action, keeping the three vows;", "Without focus, exert yourself in benefitting beings through compassion.", "‘To engage in the two accumulations indivisibly’ is my heart advice.", "30. If we have listened to many learned masters and received deep instructions,", "Have studied a few sūtras and tantras,", "Without ever applying them—‘Oh how pitiful!’—we are just fooling ourselves.", "For myself and others like me, I have explained these thirty pieces of heart advice. Through composing this, with a mind of renunciation, may all beings be freed from cyclic existence and reach the pure realms. May I emulate the conduct of the victors of the three times, their heirs and the great rishis, so that I may become their foremost heir.", "Motivated by a slight sense of renunciation, I, Tsultrim Lodrö, composed these thirty pieces of heart advice. May all be auspicious!"]}, {"id": "LH023", "title": "Advice on Abandoning the Eight Worldly Concerns", "author": "Nyala Pema Dündul", "playlist": "simplicity-what-matters", "credit": "Translated by Gyurme Avertin and Adam Pearcey, 2013.", "url": "https://www.lotsawahouse.org/tibetan-masters/nyala-pema-dundul/advice-on-abandoning-the-eight-worldly-concerns", "version": "1.3–20230220", "retrieved": "2026-11-02", "minutes": 2, "paras": ["Aho! Listen well, all you fortunate, supreme disciples of excellent karma!", "Gain and loss, happiness and unhappiness,", "Fame and insignificance, praise and blame—", "These are what we call “the eight worldly concerns.”", "Those who cling to the duality of good and bad, and feel pleasure and frustration,", "Can’t even be called practitioners of non-dual self-liberation,", "Bound as they are by the chains of attachment to the eight worldly concerns.", "Whatever happens, whether it appears good or bad, pleasurable or painful,", "Is just like the ten similes of illusion — recognise this!", "And, in a state of perfection, transcending the ordinary mind, and beyond words, thought and description,", "Rest in the expanse of the view, beyond the limitations of hope and fear.", "This advice on abandoning the eight worldly concerns,", "Was put together by the old beggar Padma,", "For a group of students who had repeatedly requested it.", "Through this, may my followers, yogis intent upon enlightenment,", "Be free from even so much as a single thought", "That is deceived by the māra of the eight worldly concerns!"]}, {"id": "LH024", "title": "Advice from Me to Myself", "author": "Patrul Rinpoche", "playlist": "simplicity-what-matters", "credit": "Translation by Constance Wilkinson.", "url": "https://www.lotsawahouse.org/tibetan-masters/patrul-rinpoche/advice-from-me-to-myself", "version": "1.0–20241114", "retrieved": "2026-11-02", "minutes": 10, "paras": ["Vajrasattva, sole deity, Master,", "You sit on a full-moon lotus-cushion of white light", "In the hundred-petalled full bloom of youth.", "Think of me, Vajrasattva,", "You who remain unmoved within the manifest display", "That is Mahamudra, pure bliss-emptiness.", "Listen up, old bad-karma Patrul,", "You dweller-in-distraction.", "For ages now you’ve been", "Beguiled, entranced, and fooled by appearances.", "Are you aware of that? Are you?", "Right this very instant, when you’re", "Under the spell of mistaken perception", "You’ve got to watch out.", "Don’t let yourself get carried away by this fake and empty life.", "Your mind is spinning around", "About carrying out a lot of useless projects:", "It’s a waste! Give it up!", "Thinking about the hundred plans you want to accomplish,", "With never enough time to finish them,", "Just weighs down your mind.", "You’re completely distracted", "By all these projects, which never come to an end,", "But keep spreading out more, like ripples in water.", "Don’t be a fool: for once, just sit tight.", "Listening to the teachings—you’ve already heard hundreds of teachings,", "But when you haven’t grasped the meaning of even one teaching,", "What’s the point of more listening?", "Reflecting on the teachings—even though you’ve listened,", "If the teachings aren’t coming to mind when needed,", "What’s the point of more reflection? None.", "Meditating according to the teachings—", "If your meditation practice still isn’t curing", "The obscuring states of mind—forget about it!", "You’ve added up just how many mantras you’ve done—", "But you aren’t accomplishing the kyerim visualization.", "You may get the forms of deities nice and clear—", "But you’re not putting an end to subject and object.", "You may tame what appear to be evil spirits and ghosts,", "But you’re not training the stream of your own mind.", "Your four fine sessions of sadhana practice,", "So meticulously arranged—", "Forget about them.", "When you’re in a good mood,", "Your practice seems to have lots of clarity—", "But you just can’t relax into it.", "When you’re depressed,", "Your practice is stable enough", "But there’s no brilliance to it.", "As for awareness,", "You try to force yourself into a rigpa-like state,", "As if stabbing a stake into a target!", "When those yogic positions and gazes keep your mind stable", "Only by keeping mind tethered—", "Forget about them!", "Giving high-sounding lectures", "Doesn’t do your mind-stream any good.", "The path of analytical reasoning is precise and acute—", "But it’s just more delusion, good-for-nothing goat-shit.", "The oral instructions are very profound", "But not if you don’t put them into practice.", "Reading over and over those dharma texts", "That just occupy your mind and make your eyes sore—", "Forget about it!", "You beat your little damaru drum—ting, ting—", "And your audience thinks it’s charming to hear.", "You’re reciting words about offering up your body,", "But you still haven’t stopped holding it dear.", "You’re making your little cymbals go cling, cling—", "Without keeping the ultimate purpose in mind.", "All this dharma-practice equipment", "That seems so attractive—", "Forget about it!", "Right now, those students are all studying so very hard,", "But in the end, they can’t keep it up.", "Today, they seem to get the idea,", "But later on, there’s not a trace left.", "Even if one of them manages to learn a little,", "He rarely applies his “learning” to his own conduct.", "Those elegant dharma disciples—", "Forget about them!", "This year, he really cares about you,", "Next year, it’s not like that.", "At first, he seems modest,", "Then he grows exalted and pompous.", "The more you nurture and cherish him,", "The more distant he grows.", "These dear friends", "Who show such smiling faces to begin with—", "Forget about them!", "Her smile seems so full of joy—", "But who knows if that’s really the case?", "One time, it’s pure pleasure,", "Then it’s nine months of mental pain.", "It might be fine for a month,", "But sooner or later, there’s trouble.", "People teasing; your mind embroiled—", "Your lady-friend—", "Forget about her!", "These endless rounds of conversation", "Are just attachment and aversion—", "It’s just more goat-shit, good for nothing at all.", "At the time it seems marvellously entertaining,", "But really, you’re just spreading around stories about other people’s mistakes.", "Your audience seems to be listening politely,", "But then they grow embarrassed for you.", "Useless talk that just make you thirsty—", "Forget about it!", "Giving teachings on meditation texts", "Without yourself having", "Gained actual experience through practice,", "Is like reciting a dance-manual out loud", "And thinking that’s the same as actually dancing.", "People may be listening to you with devotion,", "But it just isn’t the real thing.", "Sooner or later, when your own actions", "Contradict the teachings, you’ll feel ashamed.", "Just mouthing the words,", "Giving dharma explanations that sound so eloquent—", "Forget about it!", "When you don’t have a text, you long for it;", "Then when you’ve finally gotten it, you hardly look at it.", "The number of pages seems few enough,", "But it’s a bit hard to find time to copy them all.", "Even if you copied down all the dharma texts on earth,", "You wouldn’t be satisfied.", "Copying down texts is a waste of time", "(Unless you get paid)—", "So forget about it!", "Today, they’re happy as clams—", "Tomorrow, they’re furious.", "With all their black moods and white moods,", "People are never satisfied.", "Or even if they’re nice enough,", "They may not come through when you really need them,", "Disappointing you even more.", "All this politeness, keeping up a", "Courteous demeanor—", "Forget about it!", "Worldly and religious work", "Is the province of gentlemen.", "Patrul, old boy—that’s not for you.", "Haven’t you noticed what always happens?", "An old bull, once you’ve gone to the trouble of borrowing him for his services,", "Seems to have absolutely no desire left in him at all—", "(Except to go back to sleep).", "Be like that—desireless.", "Just sleep, eat, piss, shit.", "There’s nothing else in life that has to be done.", "Don’t get involved with other things:", "They’re not the point.", "Keep a low profile,", "Sleep.", "In the triple universe", "When you’re lower than your company", "You should take the low seat.", "Should you happen to be the superior one,", "Don’t get arrogant.", "There’s no absolute need to have close friends;", "You’re better off just keeping to yourself.", "When you’re without any worldly or religious obligations,", "Don’t keep on longing to acquire some!", "If you let go of everything—", "Everything, everything—", "That’s the real point!", "This advice was written by the practitioner Trimé Lodro (Patrul Rinpoche) for his intimate friend Abu Shri (Patrul Rinpoche), in order to give advice that is tailored exactly to his capacities.", "This advice should be put into practice.", "Even though you don’t know how to practice, just let go of everything—that’s what I really want to say. Even though you aren’t able to succeed in your dharma practice, don’t get angry.", "May it be virtuous.", "Many questions about the text were clarified according to the extremely kind explanations of the Chogyal Namkhai Norbu Rinpoche, during his stay in New York City, and according to the detailed explanations of Khenpo, Rigdzin Dorje of the Nyingmapa Shedra, Bansbari, Kathmandu, Nepal.", "Thanks to Matthieu Ricard of Shechen Tennyi Dargyeling, and to Anne Burchardi of the Marpa Institute of Translation for their advice toward trying to make this translation faithful to both the letter and spirit of the original Tibetan.", "All errors and misunderstandings are those of the translator. May this poem, despite all shortcomings of its translation, serve to benefit beings.", "Sarva Mangalam."]}, {"id": "LH025", "title": "Three Principal Aspects of the Path", "author": "Tsongkhapa Lobzang Drakpa", "playlist": "simplicity-what-matters", "credit": "Translated by Adam Pearcey, 2006. Revised 2012.", "url": "https://www.lotsawahouse.org/tibetan-masters/tsongkhapa/three-principal-aspects", "version": "2.2–20211228", "retrieved": "2026-11-02", "minutes": 5, "paras": ["Homage to the precious noble masters!", "1. The very essence of all the buddhas’ teachings,", "The path that is praised by the noble bodhisattvas,", "And the entrance for all fortunate ones desiring liberation—", "To the best of my ability, I shall now set forth.", "2. You who are unattached to saṃsāra’s pleasures,", "And strive to make full use of the freedoms and advantages,", "You who follow the path delighting all the buddhas—", "Fortunate ones, listen well, with a clear and open mind.", "3. Whilst lacking pure renunciation there is no way to pacify", "The continual thirst for pleasure in the ocean of saṃsāra,", "And since all living beings are bound by their craving for existence,", "You must begin by finding the determination to be free.", "4. The freedoms and advantages are rare, and there’s no time to waste—", "Reflect on this again and yet again, and dispel attachment to this life.", "To dispel attachment to your future lives, contemplate repeatedly", "The unfailing effects of karma and the sufferings of saṃsāra.", "5. When, through growing accustomed to thinking in this way,", "Hope for the pleasures of saṃsāra no longer arises even for an instant,", "And throughout both day and night you long for liberation,", "Then, at that time, true renunciation has been born.", "6. Yet if this renunciation is not embraced", "By the pure motivation of bodhicitta,", "It will not become a cause for the perfect bliss of unsurpassed awakening,", "So the wise should generate supreme bodhicitta.", "7. Beings are swept along by the powerful current of the four rivers,[1]", "Tightly bound by the chains of their karma, so difficult to undo,", "Ensnared within the iron trap of their self-grasping,", "And enshrouded in the thick darkness of ignorance.", "8. Again and yet again, they are reborn in limitless saṃsāra,", "And constantly tormented by the three forms of suffering.[2]", "This is the current condition of all your mothers from previous lives.", "Contemplate their plight and generate supreme bodhichitta.", "9. If you lack the wisdom that realizes the nature of things,", "Although you might grow accustomed to renunciation and bodhicitta,", "You will be incapable of cutting through conditioned existence at its root.", "Exert yourself, therefore, in the methods for realizing interdependence.", "10. The one who sees that cause and effect operate infallibly", "For all the phenomena of saṃsāra and nirvāṇa,", "And for whom any objects of conceptual focus have subsided,", "Has set out upon the path delighting all the buddhas.", "11. The knowledge that appearances arise unfailingly in dependence,", "And the knowledge that they are empty and beyond all assertions—", "As long as these two appear to you as separate,", "There can be no realization of the Buddha’s wisdom.", "12. Yet when they arise at once, not each in turn but both together,", "Then through merely seeing unfailing dependent origination", "Certainty is born, and all modes of misapprehension fall apart—", "That is when discernment of the view has reached perfection.", "13. When you know that appearances dispel the extreme of existence,", "While the extreme of nothingness is eliminated by emptiness,[3]", "And you also come to know how emptiness arises as cause and effect,", "Then you will be immune to any view entailing clinging to extremes.", "14. When, in this way, you have correctly understood", "The key points of the three principal aspects of the path,", "Withdraw to solitude, dear son, strengthen your diligence,", "And swiftly accomplish the ultimate and lasting aim.", "This advice was given by the bhikṣu of extensive learning, Lobzang Drakpé Pal, to Tsakho Önpo Ngawang Drakpa."]}, {"id": "LH026", "title": "Advice on Friendship", "author": "Patrul Rinpoche", "playlist": "family-friends", "credit": "Translated by Adam Pearcey, 2021.", "url": "https://www.lotsawahouse.org/tibetan-masters/patrul-rinpoche/advice-on-friendship", "version": "", "retrieved": "2026-11-02", "minutes": 4, "paras": ["Advice to Lama Rigdzin Gyatso", "On Understanding the Influence of Companions and Avoiding and Adopting Them Accordingly", "by Patrul Rinpoche", "The influence of good friends’ behaviour is as follows:", "The company of the wise increases intelligence.", "The company of the compassionate awakens bodhicitta.", "The company of the contented reduces desires.", "The company of the generous inspires a willingness to give.", "The company of the calm and collected improves one’s own temperament.", "The company of the disenchanted inspires disillusionment, and", "The company of the renunciant inspires a wish to be free.", "The company of those concerned with future lives is a reminder of virtue.", "The company of the good inspires the wish for liberation.", "The company of the dharmic is a reminder to practice Dharma.", "The company of those with limited desires inspires contentment.", "The company of the diligent greatly strengthens one’s valour.", "The company of the honourable inspires virtuous qualities.", "The company of freedom-seekers encourages the pursuit of lasting happiness.", "The company of the virtuous inspires a wholesome attitude.", "The company of those with pure perception engenders devotion.", "The company of the prudent leads to the fulfilment of long-term aspirations.", "Such is the behaviour of positive friends.", "Keep, therefore, to virtuous companions.", "The influence of bad friends’ behaviour is as follows:", "The company of the foolish obscures wisdom.", "The company of the aggressive spoils one’s own character.", "The company of the lustful produces thoughts of youth.[1]", "The company of the miserly engenders avarice.", "The company of the arrogant induces an attitude of posturing.", "The company of those without renunciation breeds attachment to this life.", "The company of those immersed in this life breeds forgetfulness of the next.", "The company of the vulgar inspires thoughts of husbandry and trade.", "The company of the wealth-seeking inspires concern for business.", "The company of the acquisitive brings thoughts of accumulation and hoarding.", "The company of the indolent engenders idle discouragement.", "The company of the distracted leads to overwhelming diversions.", "The company of the fanciful diverts attention toward this life.", "The company of the wicked inspires an unwholesome mind.", "The company of the faithless diminishes pure perception.", "The company of the superficial triggers nonvirtuous thought.", "Such is the behaviour of negative associates.", "Avoid, for these reasons, unwholesome company.", "Patrul wrote this for Lama Rigdzin Gyatso. May virtue abound!"]}, {"id": "LH027", "title": "Advice for Beginners", "author": "Mipham Rinpoche", "playlist": "beginners", "credit": "Translated by Adam Pearcey, 2012.", "url": "https://www.lotsawahouse.org/tibetan-masters/mipham/advice-for-beginners", "version": "1.3–20220421", "retrieved": "2026-11-02", "minutes": 2, "paras": ["Kyeho! All activities within saṃsāra are pointless and hollow—", "Unreliable and fleeting, like lightning’s streaking dance,", "And there is no certainty as to when death will strike.", "Still, since death is certain, limit idle plans and speculations,", "Allow the teacher’s instructions to hit home and strike a chord,", "And, single-pointedly, in solitude, seek perfect certainty of mind.", "Mind, which is like lightning, a breeze, or passing clouds,", "Is coloured by its various thoughts of everything under the sun,", "But when examined thoroughly is found to lack a basis or origin.", "Just like a mirage on the horizon, it is devoid of essential nature.", "While being empty, it appears; and while appearing, it is empty.", "Left to settle, naturally, by itself, mind arrives at a genuine state of ease,", "And, when familiarity grows stable, mind’s natural condition is seen.", "If devotion to the teacher grows vast, blessings will enter and inspire the mind,", "And when accumulations are gathered and obscurations purified, realization will dawn—", "So take this practice to heart, carefully and with constant effort!", "When some beginners asked me for advice on practice, I, the one called Mipham, wrote this for their instruction. May virtue abound!"]}, {"id": "LH028", "title": "Beginners’ Obstacles to Meditation", "author": "Adzom Gyalse Gyurme Dorje", "playlist": "beginners", "credit": "Translated by Sean Price, 2019.", "url": "https://www.lotsawahouse.org/tibetan-masters/adzom-gyalse-gyurme-dorje/advice-beginners-overcoming-obstacles-in-meditation", "version": "1.1–20240719", "retrieved": "2026-11-02", "minutes": 2, "paras": ["Advice for Beginners: How to Overcome Obstacles to Meditation", "by Adzom Gyalse, Gyurme Dorje", "Beginners should watch for three obstacles when practising meditation:", "Initially, distracting thoughts involving attachment, aversion and so on may arise. When this happens supplicate your guru, and by bringing him or her to mind, you’ll be freed from this obstacle.", "In the interim, you may fall prey to the curses and spells of demons and other ethereal entities, so that you experience illness, sharp pains and the like. At that time, supplicate your sublime guru, pray to be able to use these difficulties to enhance your spiritual path, and, as a result, you’ll pass through the obstacle.", "Eventually, all yogins, regardless of capacity, will garner fame and respect, be showered with donations, etc. The failure to recognize these as obstacles to spiritual practice will hinder your progress; it is imperative to acknowledge them as deviations!", "If you are free of these three obstacles, your Dharma practice will remain incorruptible.", "This is crucial advice."]}, {"id": "LH029", "title": "Heart Treasure for the Warriors", "author": "Atiśa Dīpaṃkara", "playlist": "beginners", "credit": "Samye Translations, December 2020 (trans. Laura Swan and Maitri Yarnell, ed. Libby Hogg). First published on Lotsawa House, 2021.", "url": "https://www.lotsawahouse.org/indian-masters/atisha/heart-treasure-for-warriors", "version": "1.0–20211001", "retrieved": "2026-11-02", "minutes": 7, "paras": ["Heart Treasure for the Warriors Who Long for Liberation", "by Atiśa Dīpaṃkara", "When Lord Atiśa first went to Ngari, he stayed for two years and, while there, granted a wealth of teachings to Lha Changchub Ö and others. He then thought to return to India, and as he prepared to depart, Lha Changchup Ö requested him to give a final piece of advice. Lord Atiśa replied that what he had taught in the past was enough, but Lha insisted, pleading with him, and so Lord Atiśa imparted these words of advice.", "How wondrous! Dear friends of high knowledge and pure, noble intent,", "Though I, a trifling and unintelligent man, am unfit to give you advice,", "Precious supreme friends, more dear than my heart itself, you entreat me thus,", "And so I, this foolish little man, offer these thoughts to your noble minds.", "Friends, until you reach awakening you need a guru, so follow a sublime spiritual friend.", "Until you realize the natural state you need to receive teachings, so listen to the guru’s instructions.", "You won’t become buddhas through mere knowledge of the Dharma. Knowledge is not enough; you must practice!", "Avoid places that disturb your mind, and always stay in places that enhance virtue.", "Until you gain stability, hustle and bustle is detrimental, so hold fast to isolated forest retreats.", "Avoid companions who stir up the afflictions; keep company with those who encourage virtue, and cherish them.", "Work and tasks will never end, so put projects aside and be still.", "Dedicate all your virtue, day and night, and keep constant guard over your mind.", "It is a pith instruction to follow the words of the guru, so do whatever he tells you, be it meditation or anything else.", "Apply yourself to the guru’s instructions with great devotion, and before long results will emerge on their own.", "If you practice Dharma wholeheartedly, food and clothing will always find you – that’s how it goes.", "Dear friends, be content, for desire is like salt water; drinking it only makes you thirst for more.", "Do away with conceit, arrogance, pretense, and pride, and make yourselves humble and tamed.", "So-called meritorious busyness is an obstacle for Dharma practice, so give it up.", "Honor and gain are the traps of Māra, so cast them away like stones from a weighing scale.", "Words of praise and fame will lead you astray, so toss them aside like revolting lumps of snot.", "Comfort, joy, and caring friends – you might have them all now, but they’ll fade soon enough, so leave them behind.", "Your future lives are much longer than this one, so prepare your provisions for the future and bury your treasure now!", "All is lost in the end, so strive not and cling to naught.", "Arouse compassion for the needy and never ignore them, nor treat them with disdain.", "Rid yourself of bias and prejudice toward enemies and rival clans.", "Do not envy those with talent and learning; rouse respect, and learn from them.", "Look not at others’ faults but at your own, and rid yourself of them as you would infected blood.", "Think not of your own but of others’ virtue, and treat everyone with respect, as a servant would.", "Regard all beings as your parents, and care for them with the love of a child.", "Keep a smile on your face and love in your heart, and speak frankly, free from anger.", "Irrelevant chatter will lead to confusion, so speak in a measured, appropriate way.", "Pointless activity will interrupt your spiritual practice, so set aside all deeds that are not Dharma.", "Don’t exert yourself in meaningless work; such efforts will only tire you out.", "Due to karma and external circumstances you may not accomplish what you have set out to do. Thus it is better to relax and let be, and you will be happy and at ease.", "Displeasing a noble being is as grave as death itself; thus don’t do things that you will regret but be a trustworthy and honest person.", "The pleasure and pain of this life stem from your own past karma, so don’t lay blame elsewhere.", "All happiness is the guru’s blessing, so strive to repay his kindness and grace.", "Until you tame your own mind, you cannot tame others’, so first tame yourself.", "If you lack clairvoyance you can’t ripen others, so exert yourself in practice.", "When you die, all your wealth is sure to be left behind, so don’t go amassing sins for the sake of wealth.", "It is futile to lose yourself to luxury and wealth. Instead, adorn yourself with the glory of giving.", "It will bring beauty in this life and bliss in the next, so maintain a pure and constant discipline.", "In these degenerate times aggression is on the rise, so don the armor of patience, free from aggression.", "It is our laziness that keeps us here, so rekindle your efforts in practice like a blazing pyre.", "Our lives run out in constant distraction, so now let us train in meditation.", "Swayed by wrong views, we fail to realize the natural state, so let us examine the genuine nature of things.", "Dear friends, here in the swamp of saṃsāra there is no happiness, so let us journey to the dry shore of liberation.", "Train correctly in the guru’s instructions; dry up the ocean of saṃsāra’s suffering.", "Take these words to heart: they are spoken sincerely and so are worthy of attention.", "If you do so, you will bring joy to me, and happiness to yourself and others too.", "I humbly request you to take heed of these instructions that I, this foolish man, have given.", "Thus Lord Atiśa spoke to the venerable Changchub Ö.", "Whatever wholesome virtue is created by this,", "I dedicate it to the fulfillment of all the aspirations made", "By the sugatas of the three times, and their heirs,", "And as a cause for upholding the sacred Dharma of scripture and realization!", "Sarva maṅgalam![1]"]}];
