e highest aim,", "I will always hold them dear.", "2. Whenever I’m in the company of others,", "I will regard myself as the lowest among all,", "And from the depths of my heart", "Cherish others as supreme.", "3. In my every action, I will watch my mind,", "And the moment destructive emotions arise,", "I will confront them strongly and avert them,", "Since they will hurt both me and others.", "4. Whenever I see ill-natured beings,", "Or those overwhelmed by heavy misdeeds or suffering,", "I will cherish them as something rare,", "As though I’d found a priceless treasure.", "5. Whenever someone out of envy", "Does me wrong by attacking or belittling me,", "I will take defeat upon myself,", "And give the victory to others.", "6. Even when someone I have helped,", "Or in whom I have placed great hopes", "Mistreats me very unjustly,", "I will view that person as a true spiritual teacher.", "7. In brief, directly or indirectly,", "I will offer help and happiness to all my mothers,", "And secretly take upon myself", "All their hurt and suffering.", "8. I will learn to keep all these practices", "Untainted by thoughts of the eight worldly concerns.", "May I recognize all things as like illusions,", "And, without attachment, gain freedom from bondage."]}, {"id": "LH011", "title": "37 Practices of Bodhisattvas", "author": "Gyalse Tokme Zangpo", "playlist": "anger-difficult-people", "credit": "Translated by Adam Pearcey, 2006.", "url": "https://www.lotsawahouse.org/tibetan-masters/gyalse-thogme-zangpo/37-practices-all-bodhisattvas", "version": "1.6–20250303", "retrieved": "2026-11-02", "minutes": 14, "paras": ["The Thirty-Seven Practices of All the Bodhisattvas", "by Gyalse Tokme Zangpo", "Namo Lokeśvarāya!", "You see that all things are beyond coming and going,", "Yet still you strive solely for the sake of living beings—", "To you, my precious guru inseparable from Lord Avalokita,", "I offer perpetual homage, respectfully, with body, speech and mind.", "The perfect buddhas, who are the source of all benefit and joy,", "Come into being through accomplishing the sacred Dharma.", "And since this in turn depends on knowing how to practise,", "I shall now describe the practices of all the buddhas’ heirs.", "1. The practice of all the bodhisattvas is to study, reflect and meditate,", "Tirelessly, both day and night, without ever straying into idleness,", "In order to free oneself and others from this ocean of saṃsāra,", "Having gained this supreme vessel—a free, well-favoured human life, so difficult to find.", "2. The practice of all the bodhisattvas is to leave behind one’s homeland,", "Where our attachment to family and friends overwhelms us like a torrent,", "While our aversion towards enemies rages inside us like a blazing fire,", "And delusion’s darkness obscures what must be adopted and abandoned.", "3. The practice of all the bodhisattvas is to take to solitary places,", "Avoiding the unwholesome, so that destructive emotions gradually fade away,", "And, in the absence of distraction, virtuous practice naturally gains strength;", "Whilst, with awareness clearly focused, we gain conviction in the teachings.", "4. The practice of all the bodhisattvas is to renounce this life’s concerns,", "For friends and relatives, long acquainted, must all go their separate ways;", "Wealth and prized possessions, painstakingly acquired, must all be left behind;", "And consciousness, the guest who lodges in the body, must in time depart.", "5. The practice of all the bodhisattvas is to avoid destructive friends,", "In whose company the three poisons of the mind grow stronger,", "And we engage less and less in study, reflection and meditation,", "So that love and compassion fade away until they are no more.", "6. The practice of all the bodhisattvas is to cherish spiritual friends,", "By regarding them as even more precious than one’s own body,", "Since they are the ones who will help to rid us of all our faults,", "And make our virtues grow ever greater just like the waxing moon.", "7. The practice of all the bodhisattvas is to take refuge in the Three Jewels,", "Since they will never fail to provide protection for all who call upon them,", "For whom are the ordinary gods of this world ever capable of helping,", "As long as they themselves are trapped within saṃsāra’s vicious cycle?", "8. The practice of all the bodhisattvas is never to commit a harmful act,", "Even though not to do so might put one’s very life at risk,", "For the Sage himself has taught how negative actions will ripen", "Into the manifold miseries of the lower realms, so difficult to endure.", "9. The practice of all the bodhisattvas is to strive towards the goal,", "Which is the supreme state of changeless, everlasting liberation,", "Since all the happiness of the three realms lasts but a moment,", "And then is quickly gone, just like dewdrops on blades of grass.", "10. The practice of all the bodhisattvas is to arouse bodhicitta,", "So as to bring freedom to all sentient beings, infinite in number.", "For how can true happiness ever be found while our mothers,", "Who have cared for us throughout the ages, endure such pain?", "11. The practice of all the bodhisattvas is to make a genuine exchange", "Of one’s own happiness and well-being for all the sufferings of others.", "Since all misery comes from seeking happiness for oneself alone,", "Whilst perfect buddhahood is born from the wish for others’ good.", "12. Even if others, in the grips of great desire, should steal,", "Or encourage others to take away, all the wealth that I possess,", "To dedicate to them entirely my body, possessions and all my merits", "From the past, present and future— this is the practice of all the bodhisattvas.", "13. Even if others should seek to cut off my head,", "Though I’ve done them not the slightest wrong,", "To take upon myself, out of compassion,", "All the harms they have amassed—this is the practice of all the bodhisattvas.", "14. Even if others should declare before the world", "All manner of unpleasant things about me,", "To speak only of their qualities in return,", "With a mind that’s filled with love—this is the practice of all the bodhisattvas.", "15. Even if others should expose my hidden faults or deride me", "When speaking amidst great gatherings of many people,", "To conceive of them as spiritual friends and to bow", "Before them in respect—this is the practice of all the bodhisattvas.", "16. Even if others whom I have cared for like children of my own", "Should turn upon me and treat me as an enemy,", "To regard them only with special fondness and affection,", "As a mother would her ailing child—this is the practice of all the bodhisattvas.", "17. Even if others, equal or inferior to me in status,", "Should, out of arrogance, disparage me,", "To honour them, as I would my teacher,", "By bowing down my head before them—this is the practice of all the bodhisattvas.", "18. Even though I may be destitute and despised by all,", "Beset with terrible illness and plagued by evil spirits,", "Still to take upon myself all beings’ ills and harmful actions,", "Without ever losing heart—this is the practice of all the bodhisattvas.", "19. Even though I may be famous and revered by all,", "And as rich as Vaiśravaṇa, the god of wealth himself,", "To see the futility of all the glory and riches of this world", "And to remain without conceit—this is the practice of all the bodhisattvas.", "20. The practice of all the bodhisattvas is to subdue the mind", "With the forces of loving kindness and compassion.", "For unless the real adversary—my own anger—is defeated,", "Outer enemies, though I may conquer them, will continue to appear.", "21. The practice of all the bodhisattvas is to turn away immediately", "From those things which bring desire and attachment.", "For the pleasures of the senses are just like salty water:", "The more we taste of them, the more our thirst increases.", "22. The practice of all the bodhisattvas is never to entertain concepts,", "Which revolve around dualistic notions of perceiver and perceived,", "In the knowledge that all these appearances are but the mind itself,", "Whilst mind’s own nature is forever beyond the limitations of ideas.", "23. The practice of all the bodhisattvas is to let go of grasping", "When encountering things one finds pleasant or attractive,", "Considering them to be like rainbows in the summer skies—", "Beautiful in appearance, yet in truth devoid of any substance.", "24. The practice of all the bodhisattvas is to recognize delusion", "Whenever one is confronted by adversity or misfortune.", "For these sufferings are just like the death of a child in a dream,", "And it’s so exhausting to cling to delusory perceptions as real.", "25. The practice of all the bodhisattvas is to give out of generosity,", "With no hopes of karmic recompense or expectation of reward.", "For if those who seek awakening must give even their own bodies,", "What need is there to mention mere outer objects and possessions?", "26. The practice of all the bodhisattvas is to observe ethical restraint,", "Without the slightest intention of continuing in saṃsāric existence.", "For lacking discipline one will never secure even one’s own well-being,", "And so any thought of bringing benefit to others would be absurd.", "27. The practice of all the bodhisattvas is to cultivate patience,", "Free from any trace of animosity towards anyone at all,", "Since any potential source of harm is like a priceless treasure", "To the bodhisattva who is eager to enjoy a wealth of virtue.", "28. The practice of all the bodhisattvas is to strive with enthusiastic diligence—", "The source of all good qualities—when working for the sake of all who live;", "Seeing that even śrāvakas and pratyekabuddhas, who labour for themselves alone,", "Exert themselves as if urgently trying to extinguish fires upon their heads.", "29. The practice of all the bodhisattvas is to cultivate concentration,", "Which utterly transcends the four formless absorptions,", "In the knowledge that mental afflictions are overcome entirely", "Through penetrating insight suffused with stable calm.", "30. The practice of all the bodhisattvas is to cultivate wisdom,", "Beyond the three conceptual spheres, alongside skilful means,", "Since it is not possible to attain the perfect level of awakening", "Through the other five pāramitās alone, in wisdom’s absence.", "31. The practice of all the bodhisattvas is to scrutinize oneself", "Continually and to rid oneself of faults whenever they appear.", "For unless one checks carefully to find one’s own confusion,", "One might appear to be practising Dharma, but act against it.", "32. The practice of all the bodhisattvas is never to speak ill", "Of others who have embarked upon the greater vehicle,", "For if, under the influence of destructive emotions,", "I speak of other bodhisattvas’ failings, it is I who am at fault.", "33. The practice of all the bodhisattvas is to let go of attachment", "To the households of benefactors and of family and friends,", "Since one’s study, reflection and meditation will all diminish", "When one quarrels and competes for honours and rewards.", "34. The practice of all the bodhisattvas is to avoid harsh words,", "Which others might find unpleasant or distasteful,", "Since abusive language upsets the minds of others,", "And thereby undermines a bodhisattva’s conduct.", "35. The practice of all the bodhisattvas is to slay attachment", "And the rest—mind’s afflictions—at once, the very moment they arise,", "Taking as weapons the remedies held with mindfulness and vigilance.", "For once the kleshas have become familiar, they’ll be harder to avert.", "36. In short, no matter what one might be doing,", "By examining always the status of one’s mind,", "With continuous mindfulness and alertness,", "To bring about the good of others—this is the practice of all the bodhisattvas.", "37. The practice of all the bodhisattvas is to dedicate towards enlightenment", "All the virtue to be gained through making effort in these ways,", "With wisdom that is purified entirely of the three conceptual spheres,", "So as to dispel the sufferings of the infinity of beings.", "Here I have set down for those who wish to follow the bodhisattva path,", "Thirty-seven practices to be adopted by all the buddhas’ heirs,", "Based on what is taught in the sūtras, tantras and treatises,", "And following the instructions of the great masters of the past.", "Since my intellect is only feeble and I have studied but a little,", "This is not a composition likely to delight the connoisseurs,", "Yet since I’ve relied upon the sūtras and what the saints have taught", "I feel these are indeed the genuine trainings of the buddhas’ heirs.", "Still, the tremendous waves of activity of the bodhisattvas", "Are difficult for simple-minded folk like me to comprehend,", "And I must therefore beg the indulgence of all the perfect saints", "For any contradictions, irrelevancies or other flaws this may contain.", "Through whatever merit has here been gained, may all beings", "Generate sublime bodhicitta, both relative and absolute,", "And through this, come to equal Lord Avalokiteśvara,", "Transcending the extremes of existence and quiescence.", "This was composed in Jewel Cave (Rinchen Puk) in Ngulchu by the monk Tokme, a teacher of scripture and reasoning, for his own and others’ benefit."]}, {"id": "LH012", "title": "The Bodhisattva’s Garland of Jewels", "author": "Atiśa Dīpaṃkara", "playlist": "anger-difficult-people", "credit": "Rigpa Translations, 2008. Revised 2012.", "url": "https://www.lotsawahouse.org/indian-masters/atisha/jewel-rosary-bodhisattvas", "version": "2.1–20250325", "retrieved": "2026-11-02", "minutes": 7, "paras": ["In the language of India: Bodhisattvamaṇyāvalī", "In the language of Tibet: changchub sempé norbü trengwa (byang chub sems dpa’i nor bu’i phreng ba)", "In the English language: The Bodhisattva’s Garland of Jewels", "Homage to great compassion!", "Homage to the deities who inspire faith and devotion!", "Homage to the masters!", "Be done with doubt and indecision,", "And embrace your practice with all your heart.", "Shake off lethargy, dullness and laziness,", "And strive always with enthusiasm and joy.", "Mindful, vigilant and careful,", "Guard the doorways of your senses at every moment.", "Three times each day, three times at night,", "Again and again, examine your thoughts.", "Make plain your own failings,", "But don’t look for faults in others.", "Make known the good points of others,", "But keep quiet about your own best qualities.", "Let go of craving for gain and honour,", "And give up the urge for profit or fame.", "Cultivate love and compassion,", "And make your bodhicitta stable.", "Avoid the ten unwholesome actions,", "And make your faith and confidence be strong.", "With few wants, be content with what you have,", "And with gratitude repay any kindness you receive.", "Overcome anger and arrogance,", "And let humility rule your mind.", "Give up any unwholesome kind of living,", "And pursue a livelihood in keeping with the Dharma.", "Do away with your addiction to material things,", "And adorn yourself with the riches of the Āryas.", "The wealth of faith, of discipline,", "Generosity and learning,", "Decency, self-control,", "And wisdom—such are the seven riches.", "These most sacred forms of wealth", "Are seven treasures that never run out.", "Do not speak of this to those who are not human.", "Leave all busyness and distraction behind,", "And dwell instead in seclusion and solitude.", "Refrain from meaningless chatter,", "And always keep a check on what you say.", "Whenever you see your master or preceptor,", "Offer to serve them with devotion and respect.", "Those who possess enlightened vision", "And those first setting out upon the path—", "Regard them both as your spiritual teachers.", "Whenever you see any sentient beings,", "Regard them as your parents or your children.", "Don’t befriend those who act in harmful ways;", "Instead rely on true spiritual friends.", "Drop any feelings of hostility or ill will,", "And be happy, wherever you choose to go.", "Avoid getting attached to anything at all,", "And stay free from craving and desire.", "Attachment not only keeps you from happy births,", "It kills the very life of liberation.", "Should you find a way to peace and happiness,", "Strive constantly to put it into practice.", "Whatever task you set out to do,", "Accomplish that very thing first.", "This way, everything will turn out well;", "If not, nothing will succeed.", "Never take pleasure in acts that harm.", "And when thoughts of superiority creep in,", "There and then, deflate your self-importance,", "And recall your master’s personal advice.", "Or whenever you feel discouraged or inadequate,", "Raise your spirits and encourage yourself.", "And always meditate on emptiness.", "Should the objects of attachment or aversion appear,", "View them as no more than illusions or projections.", "Should you hear unpleasant words,", "Consider them nothing more than echoes.", "Should you suffer physical harm,", "See it as the result of your past actions.", "Keep entirely to solitude, far away from town,", "And, like the carcass of some wild animal,", "Stay hidden in nature by yourself,", "Free of all entanglement and attachment.", "Always keep up your pledges and commitments,", "And should laziness or procrastination strike,", "Immediately take note of your errors, one by one,", "And remind yourself of the heart of your discipline.", "Whenever you meet another person,", "Speak calmly, sincerely and truthfully.", "Take care not to frown or glare,", "And always wear a cheerful smile.", "And when you’re with those you see every day,", "Don’t be stingy, but be happy to give,", "And banish all feelings of envy.", "So as to protect others’ peace of mind,", "Stay clear of quarrels of any kind,", "And be patient and always forbearing.", "Don’t flatter, or be a fickle friend,", "But be steadfast and reliable all the time.", "Never disparage or belittle other people,", "But treat everyone with respect.", "When giving advice or instructions,", "Do so with compassion and a genuine wish to help.", "Be sure never to criticize the teachings.", "Set your sights on what inspires you most,", "And, through the ten forms of Dharma practice,[1]", "Exert yourself in sessions, day and night.", "Among others, keep a check on your speech;", "When alone, keep a check on your mind.", "Whatever virtues you amass in the past, present and future,", "Dedicate them all towards great, unsurpassable awakening,", "Share your merit among all sentient beings,", "And with the seven branch practice,", "Continually make great prayers of aspiration.", "Practising like this, you will complete", "Accumulations of both merit and wisdom,", "And eliminate the two forms of obscuration.", "You will make this human life meaningful,", "And, in time, gain unsurpassable awakening.", "This concludes the Bodhisattva’s Garland of Jewels, composed by the great Indian paṇḍita Dīpaṃkara Śrījñāna."]}, {"id": "LH013", "title": "The Four Immeasurables", "author": "Buddhagupta", "playlist": "compassion-kindness", "credit": "Translated by Samye Translations (trans. Laura Swan), 2011. Revised and edited for Lotsawa House, 2016.", "url": "https://www.lotsawahouse.org/indian-masters/buddhagupta/four-immeasurables-commentary", "version": "1.3–20240919", "retrieved": "2026-11-02", "minutes": 13, "paras": ["An Extensive Commentary on the Four Immeasurables", "by Buddhagupta", "Loving kindness, compassion,", "Sympathetic joy, and equanimity—", "How to cultivate with diligence", "These great immeasurables, I shall now explain.", "Focusing on immeasurable sentient beings brings about immeasurable accumulations, immeasurable qualities, and immeasurable primordial wisdom.", "Immeasurable Sentient Beings", "We cannot calculate the total number of sentient beings, saying, “This is how many there are in the three realms.” And sentient beings are thus said to be immeasurable. As the Bhagavān said in the Noble Sūtra Teaching the Great Compassion of the Tathāgatas:", "Son of noble family, the sentient beings living in a space the size of a chariot wheel, visible to a Tathāgata, are extremely numerous. But the gods and humans throughout the world-systems of the vast billionfold universe are not like that: the realms of these imperceptible sentient beings are immeasurable.", "Therefore, as the immeasurable realms of sentient beings are beyond comprehension, sentient beings are said to be immeasurable.", "You might wonder: when cultivating the immeasurables, how should we focus on immeasurable sentient beings and meditate?", "All sentient beings of the three realms have been circling throughout the higher and lower abodes throughout beginningless time based on the power of their individual karma. As there is not a single one who, in the course of this wandering, has not been close to us many hundreds or thousands of times, think: “These are my loved ones!” And abide in equanimity, extending the four immeasurables to all sentient beings. This is what is known as focusing on immeasurable sentient beings.", "Immeasurable Accumulations", "The immeasurable accumulations are those of merit and wisdom. All four immeasurables are, in this sense, the cause, since they are the cause or essence of generating boundless gatherings of both merit and wisdom. Thus, in the sūtras, the Bhagavān also says:", "Son of noble family, to make offerings to someone who is meditating on the samādhi of loving kindness, and who has not yet risen from his or her seat, creates immeasurable merit.", "If so much merit can be gained simply by offering gifts to one who is training in immeasurable loving kindness and the rest, what need is there to mention actually practising these immeasurables and meditating on them for oneself? The amount of merit generated thereby will be far, far greater.", "This is how immeasurable stores of merit and wisdom are produced. These then serve to generate a boundless collection of qualities, which, in turn, yields limitless wisdom.", "Immeasurable Qualities", "Immeasurable qualities are the great attributes of enlightenment, such as the powers, the fearlessnesses and the rest. They are the result of the accumulations of merit and wisdom gained through abiding in the four immeasurables. As this is what brings about the great qualities of enlightenment, we must earnestly apply ourselves to these four immeasurables.", "Immeasurable Primordial Wisdom", "These four dharmas—the four immeasurables—are the focal object of the Tathāgatas’ immeasurable primordial wisdom. Alternatively, it can be explained that primordial wisdom itself abides in the state of, or as the essence of, the four dharmas of loving kindness and the rest. This is what is meant when we speak of a sphere of experience, or an essence, in which the object of cognition is inseparable from cognitive awareness itself.", "Loving Kindness", "At the stage of ‘devoted conduct’, a bodhisattva experiences the “four factors of ascertainment”: attainment of appearance, enhancement of appearance, partial engagement in the meaning of suchness, and the unobstructed samādhi. For those bodhisattvas who experience these four factors of ascertainment, the gods, humans, pretas and the like, as well as the realms of hell-beings, are all directly perceptible to their heightened faculties. When they see these gods, humans and others, as well as the beings in the lower realms whose very nature is suffering, these bodhisattvas feel particularly strong compassion for them. At the same time, they realize that these beings have been circling in saṃsāra throughout beginningless time, and, therefore, have all, without exception, been their close relations. As a consequence, they feel great loving kindness towards them all, caring for them as if they were their very own children. They make aspirations that all sentient beings may be liberated from suffering and experience only happiness, and they act to benefit all beings. This is known as loving kindness focused on sentient beings.", "Bodhisattvas on the first to the seventh bhūmis generate loving kindness towards sentient beings by directly realising the nature of things. Although all phenomena lack any true nature, sentient beings fail to realise this, and, by tightly clinging to things as real, they circle throughout the three realms. These bodhisattvas therefore feel loving kindness towards the beings who suffer in this way. They make aspirations that they might realise the true nature, and they act to benefit all beings through the Dharma. This is known as loving kindness focused on phenomena.", "From the eighth bodhisattva bhūmi onwards, up and including the attainment of enlightenment, corresponds to the level of “spontaneous accomplishment, free of focus”. From the eighth bhūmi, bodhisattvas generate loving kindness towards sentient beings while acting for their benefit spontaneously and without thought. They act for beings as in the examples of a precious, wish-fulfilling jewel or a wish-granting tree. Although these bodhisattvas are without ordinary thoughts, great loving kindness still arises spontaneously through the power of their past aspirations, and they act to bring benefit to beings. This is known as loving kindness free of focus.", "How, then, do ordinary beings, who are just beginning, train in loving kindness that is focused on sentient beings? An ordinary beginner should meditate on loving kindness focused on sentient beings according to the following stages.", "There are three types of sentient beings: 1) those one cherishes, 2) those one is indifferent towards, and 3) those one dislikes. Cherished sentient beings can then be further subdivided into three: greater, middling, and lesser. Likewise, those one is indifferent towards and those one dislikes can also be subdivided into the three categories of greater, middling, and lesser. So, in all, there are nine divisions.", "At first, visualise someone you cherish in a middling way and practice feeling towards them just as you do towards those you cherish greatly, such as your own parents. Once you are familiar with this, visualise all those to whom you are indifferent, and practice feeling towards them just as you do towards those you cherish most. Then visualise those you mildly dislike and practice feeling towards them just as you do towards those you cherish most. Once you are used to this, visualise someone you dislike in a middling way and practice feeling towards them as you do towards those you cherish most. Then finally consider those you really dislike and train in feeling towards them the kind of love you feel for your own parents.", "Through this, we can train in focusing on all sentient beings, who, throughout the course of beginningless time, have been dear to us and have even been our own parents. And, as we train in this way, even though we begin by focussing on just the members of our own family, we gradually extend the practice until it is infinite.", "Compassion", "Compassion focused on sentient beings who are suffering is the compassionate wish to dispel the sufferings of all beings, who are plagued by the three sufferings (of suffering upon suffering, and the rest) or the eight sufferings (of birth, and so on).", "Compassion focused on sentient beings who do wrong is the compassionate wish to eliminate all the harmful actions of beings whose conduct is unvirtuous, as they are the root or cause of the sufferings just mentioned.", "Compassion focused on sentient beings who are not completely liberated as they lack the necessary conditions is directed towards those who cannot hear the Dharma as they lack a spiritual teacher. As it says in a tantra, “Those who don’t follow a teacher, who don’t hear the Dharma, and who aren’t liberated, are freed through compassion.”", "Sympathetic Joy", "Sympathetic joy is delight in the various kinds of wealth that sentient beings possess: material riches, the Dharma, and happiness.", "Sympathetic joy focused on perfectly gathering the accumulations is the joy that we feel towards our own great gatherings of virtue.", "Sympathetic joy focused on the taste of sacred Dharma is the joy we feel when we (and others) experience the taste of hearing the Dharma, or the taste of contemplation and meditation.", "Equanimity", "Those who act for the welfare of sentient beings should have equanimity towards the fortunate and the unfortunate alike. Rather than discriminating, by acting only for the benefit of the fortunate and never for the unfortunate, we should act for the benefit of both in equal measure.", "The expression “eight worldly concerns, including gain and loss” also refers to happiness and suffering, praise and criticism, renown and obscurity. Being neither delighted nor upset by these situations, we should remain in equanimity. These eight worldly concerns are so called because they are well known to, and found among, the mundane.", "How do we maintain equanimity with regard to these eight concerns?", "Suppose you acquire great wealth or possessions: do not allow yourself to become too elated or attached to them. Conversely, if your wealth or possessions decline or you fail to acquire any, do not feel despondent or sad. This is known as equanimity that is free from happiness and sorrow in the face of gain and loss.", "Even if someone you are attracted to were to anoint your body with perfume, sandalwood and the like, to caress you, and to treat you with honour and respect, you must not become overjoyed or attached to such pleasures. And even if an enemy were to abuse you physically, by beating and striking you, you must not become angry. Instead, joyfully accept the pain of being struck and beaten, rather than concentrating on the suffering. This is known as equanimity that is free from happiness and sorrow in the face of joy and suffering.", "If a friend were to praise you with sweet words, describing you in glowing terms, you shouldn’t feel delighted or think of yourself as superior. Whereas, if an enemy were to discover your faults and proclaim them, you shouldn’t become sad or depressed. This is known as equanimity that is free from happiness and sorrow in the face of praise and criticism.", "Even if many people come to hear and know of your talents, don’t take delight in this acknowledgement of your attributes, thinking, “Now that so many people know of my good qualities, I will surely become famous and never be forgotten!” Alternatively, if few people ever hear of or acknowledge your qualities, don’t feel sad, thinking, “My qualities are overlooked. What a pity!” This is known as equanimity that is free from happiness and sorrow in the face of recognition and non-recognition of one’s qualities.", "“Accumulations” refers to the accumulations of merit and wisdom already explained above. Equanimity in regard to gathering the accumulations on special and ordinary occasions means that we shouldn’t differentiate, thinking, “I shall practise virtuous accumulations on this occasion, but not at other times.” Instead, we must practise virtue at all times.", "In reference to all the meditative trainings", "In the four immeasurables, the ‘Brahmic’ states,", "I have composed and set this down for beings’ sake:", "May all be unobscured, swiftly to awaken!", "This concludes An Extensive Commentary on the Four Immeasurables composed by Buddhagupta.[1]"]}, {"id": "LH014", "title": "Aspiration to Generate Bodhicitta", "author": "Patrul Rinpoche", "playlist": "compassion-kindness", "credit": "Translated by Adam Pearcey 2010. Many thanks to Alak Zenkar Rinpoche. Revised 2012 & 2020.", "url": "https://www.lotsawahouse.org/tibetan-masters/patrul-rinpoche/aspiration-generate-bodhichitta", "version": "3.2-20260819", "retrieved": "2026-11-02", "minutes": 5, "paras": ["༄༅། །རྣམ་དག་བྱང་ཆུབ་མཆོག་ཏུ་སེམས་བསྐྱེད་པའི་སྨོན་ལམ།", "Aspiration to Generate Bodhicitta, Utterly Pure and Supreme", "by Patrul Rinpoche", "ན་མོ་གུ་རུ།", "namo guru", "Namo guru!", "བསྐལ་མང་གོང་ནས་གཡོ་སྒྱུ་སྤངས་པའི་ཐུགས། །", "kal mang gong né yogyu pangpé tuk", "Your mind, many aeons ago, rid itself of all deceit,", "བཅོས་མའི་ཚུལ་སྤངས་དྲང་ཞིང་བདེན་པའི་གསུང༌། །", "chömé tsul pang drang zhing denpé sung", "Your speech, honest and true, is free of any form of artifice,", "ཚུལ་འཆོས་མི་མངའ་ཚུལ་དང་མཐུན་པའི་སྐུ། །", "tsul chö mi nga tsul dang tünpé ku", "Your body's acts are disciplined and unpretentious—", "ཐུབ་པ་དྲང་སྲོང་ཆེན་པོ་ལ་ཕྱག་འཚལ། །", "tubpa drangsong chenpo la chaktsal", "Great sage, genuine and wise,1 to you I prostrate!", "ཐུབ་པ་དེ་སྲས་བདེན་པའི་དོན་གཟིགས་པའི། །", "tubpa dé sé denpé dön zikpé", "Buddha's heirs, who have seen the ultimate meaning,", "བདེན་གསུང་མངའ་བ་བདེན་ཚིག་གྲུབ་པའི་ཚོགས། །", "den sung ngawa dentsik drubpé tsok", "Speakers of truth, whose words have prophetic power,", "ཐེག་པ་གསུམ་གྱི་ཐར་པའི་ལམ་ཞུགས་པ། །", "tekpa sum gyi tarpé lam zhukpa", "Those on the way to liberation through the three vehicles—", "དེ་དག་ཀུན་ལ་གུས་པས་ཕྱག་འཚལ་ལོ། །", "dedak kün la güpé chaktsal lo", "Before you all, in devotion, I bow down!", "བདག་ནི་དེང་ནས་སྐྱེ་དང་ཚེ་རབས་སུ། །", "dak ni deng né kyé dang tserab su", "From now on, in all future rebirths, throughout my lives,", "རྒྱལ་བ་སྲས་བཅས་ཁྱེད་དང་མི་འབྲལ་ཞིང༌། །", "gyalwa sé ché khyé dang mindral zhing", "Buddhas and bodhisattvas, may I never part from you!", "རྒྱལ་བ་སྲས་བཅས་ཁྱེད་ཀྱིས་རྗེས་བཟུང་ནས། །", "gyalwa sé ché khyé kyi jezung né", "Buddhas and bodhisattvas, please accept me as your follower!", "རྒྱལ་བ་སྲས་བཅས་ཁྱེད་བཞིན་འགྲུབ་པར་ཤོག །", "gyalwa sé ché khyé zhin drubpar shok", "Buddhas and bodhisattvas, let me gain accomplishment just like you!", "ལུས་སྤྱོད་ཚུལ་འཆོས་མེད་པར་དུལ་བ་དང༌། །", "lü chö tsul chö mepar dulwa dang", "My body's actions—may they be disciplined and unpretentious,", "ངག་ཚིག་རྫུན་གཏམ་མེད་པར་བདེན་པ་དང༌། །", "ngak tsik dzün tam mepar denpa dang", "My speech—may it be honest, without falsity or deception,", "སེམས་སྤྱོད་གཡོ་སྒྱུ་མེད་པར་དྲང་བ་ཡིས། །", "sem chö yogyu mepar drangwa yi", "My mind—may it be genuine, without artifice or deceit,", "ཆོས་མཐུན་གྲོགས་དང་བཤེས་གཉེན་བསྟེན་པར་ཤོག །", "chö tün drok dang shenyen tenpar shok", "And may I rely upon spiritual guides and true Dharma friends!", "ཐར་པའི་ལམ་ལ་དང་པོ་འཇུག་པའི་སྒོ། །", "tarpé lam la dangpo jukpé go", "The first entrance to the path of liberation,", "འཁོར་བའི་གནས་ནས་དང་པོ་བྲོས་པའི་ལམ། །", "khorwé né né dangpo dröpé lam", "The first route of escape from saṃsāra's perils,", "ཉམས་ལེན་ཆོས་རྣམས་ཀུན་གྱི་དང་པོའི་འགོ །", "nyamlen chö nam kün gyi dangpö go", "The first preliminary to all practices of Dharma:", "བཅོས་མིན་ངེས་འབྱུང་རྒྱུད་ལ་སྐྱེ་བར་ཤོག །", "chömin ngejung gyü la kyewar shok", "Genuine renunciation—may it dawn within my mind!", "ཡོད་ན་སངས་རྒྱས་སྒྲུབ་ལ་དེས་ཆོག་ཅིང༌། །", "yö na sangye drub la dé chok ching", "With it, I have all that's needed to attain enlightenment,", "མེད་ན་སངས་རྒྱས་སྒྲུབ་ལ་ཐབས་ཆག་པ། །", "mé na sangye drub la tab chakpa", "And without it, there's no way to find awakening,", "སངས་རྒྱས་སྒྲུབ་པའི་ས་བོན་མ་ནོར་བ། །", "sangye drubpé sabön ma norwa", "The indisputable seed from which buddhahood is gained,", "རྣམ་དག་བྱང་ཆུབ་སེམས་མཆོག་བསྐྱེད་པར་ཤོག །", "namdak changchub sem chok kyepar shok", "May I generate bodhicitta, utterly pure and supreme!", "གོང་ནས་གོང་དུ་བྱང་ཆུབ་སེམས་མཆོག་འཕེལ། །", "gong né gong du changchub sem chok pel", "Further and further, may supreme bodhicitta develop,", "ཚེ་རབས་ཀུན་ཏུ་བྱང་ཆུབ་སེམས་མི་བརྗེད། །", "tserab küntu changchub sem mi jé", "Throughout my lives, may bodhicitta never be forgotten,", "ཡང་དང་ཡང་དུ་བྱང་ཆུབ་སེམས་བསྒོམས་ནས། །", "yang dang yang du changchub sem gom né", "Again and again, may I meditate on bodhicitta,", "བྱང་ཆུབ་སེམས་དཔའི་སྤྱོད་ལ་འཇུག་པར་ཤོག །", "changchub sempé chö la jukpar shok", "And always train in the
