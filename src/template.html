<title>Shine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/*__STYLES__*/
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Collections"></nav>
  <div class="content" id="content">
    <div class="top">
      <label class="searchbox" for="q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search teachings or masters" autocomplete="off"></label>
      <button class="round" id="surprise" title="Surprise me" aria-label="Open a random teaching"><svg viewBox="0 0 24 24"><path d="M3 20 9.5 8l4 7 2.5-4 5 9z"/><path d="m8 12 1.5 2 1.5-2"/></svg></button>
      <button class="pill-btn" id="today-btn">Today’s teaching</button>
    </div>
    <div class="inner" id="view"></div>
  </div>
  <footer class="player" id="player">
    <div class="now"><div class="disc" id="p-disc"></div><div class="t"><b id="p-title">Choose a teaching</b><span id="p-author">Tap any card to begin</span></div></div>
    <div class="controls">
      <div class="btns">
        <button id="p-back" aria-label="Previous paragraph"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg></button>
        <button class="play" id="p-play" aria-label="Play"><svg viewBox="0 0 24 24" id="p-icon"><path d="M7 4v16l13-8z"/></svg></button>
        <button id="p-fwd" aria-label="Next paragraph"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg></button>
        <button class="stop" id="p-stop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button class="music-button" id="p-music" aria-label="Background music settings" aria-expanded="false" aria-controls="music-panel">♫</button>
      </div>
      <div class="prog"><span id="p-cur">0:00</span><input id="p-range" type="range" min="0" max="0" value="0" step="0.1" aria-label="Position in teaching"><span id="p-len">0:00</span></div>
    </div>
    <div class="extras"><span class="narrator" id="p-narrator">Sonia · AI narration</span>
    <button class="heart" id="p-heart" aria-pressed="false" aria-label="Save to favourites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-2.5A4.6 4.6 0 0 1 21 11c-2 4.6-9 9-9 9z"/></svg></button></div>
    <section class="music-panel" id="music-panel" hidden aria-labelledby="music-title">
      <button class="music-close" id="music-close" aria-label="Close music settings">×</button>
      <h2 id="music-title">Background music</h2>
      <p id="music-status" aria-live="polite">Soft ambient tones, gently beneath the voice.</p>
      <div class="music-settings"><button id="music-toggle" aria-pressed="true">Music on</button><label class="music-volume" for="music-volume">Music volume<input id="music-volume" type="range" min="0" max="100" value="25"></label></div>
    </section>
  </footer>
</div>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="r-title">
  <div class="reader-top"><span class="crumb" id="r-crumb"></span><button class="round" id="r-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="read-hero"><div class="thumb" id="r-art"></div><div><span class="kicker" id="r-shelf"></span><h1 id="r-title"></h1><p class="by" id="r-by"></p><button class="listen" id="r-listen"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Listen</button></div></div>
  <div class="paper"><div class="text"><div class="text-inner" id="r-text"></div>
    <div class="source"><strong>Source</strong><div class="cite" id="r-cite"></div><button class="copy" id="r-copy">Copy citation</button></div></div></div>
  <div class="more" id="r-more"></div>
</div>

<script>
/*__SCRIPTS__*/
</script>
